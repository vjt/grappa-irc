[package]
name = "vodozemac-binding"
version = "0.0.0"
edition = "2024"
publish = false
description = "The thin wasm-bindgen binding cicchetto uses over vodozemac (issue 2430)"

[lib]
crate-type = ["cdylib"]

[dependencies]
vodozemac = { version = "=0.11.1", default-features = false, features = ["wasm_js"] }
wasm-bindgen = "=0.2.129"
serde_json = "1"
sha2 = "=0.11.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
