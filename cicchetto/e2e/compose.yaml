# grappa — integration testing stack (cicchetto/e2e)
#
# A self-contained docker compose that boots:
#   - the azzurra-testnet (hub + leaf-v4 + leaf-v6 + services), via the
#     submodule at infra/compose.yaml — Bahamut + Anope-shape services so
#     CAP/SASL/NickServ behave like real Azzurra.
#   - grappa (dev image, build target — same source as `scripts/test.sh`),
#     pointed at irc://hub:6667 via env override (no host-DNS dependency).
#   - cicchetto-build-test (oneshot) — builds the SPA into a named volume.
#   - nginx-test — dumb reverse proxy (TLS on :443) → grappa-test:4000;
#     the BEAM self-serves the SPA (#485). Shares the substrate-agnostic
#     proxy snippet with the m42 jail + native-Linux configs.
#   - playwright-runner — Bun-based, runs the e2e suite against
#     http://nginx-test:80 from inside the docker network.
#
# Run: scripts/integration.sh (from worktree root). NEVER raw docker compose
# from outside that wrapper — it sets up tear-down on exit.
#
# Why all-in-one stack vs reusing dev/prod compose:
#   - port collisions: a dev `docker compose up` already binds :4000
#     (grappa) and :6667 (a test would clash if it also published).
#     Integration stack publishes nothing on the host — services talk
#     intra-network only. The runner reaches nginx-test by docker DNS.
#   - test isolation: separate sqlite db (runtime/grappa_test.db inside
#     the e2e named volume), separate cicchetto dist named volume, no
#     shared state with dev or prod.
#   - reproducibility: a contributor can `docker compose up` the dev
#     stack AND `scripts/integration.sh` simultaneously without
#     conflict.

name: grappa-e2e

include:
  # azzurra-testnet — hub + leaves + services. Pinned via submodule SHA.
  - path: ./infra/compose.yaml

services:
  # Drop the testnet's host port publishes. The runner talks to hub
  # by docker DNS (`bahamut-test:6667`) over the shared bridge — no
  # need to expose 6667/6697 on the host (would clash with anything
  # else listening there, e.g. a real irssi).
  # Hub stays purely an S2S router; clients (the bouncer + the runner
  # peer) ALWAYS go through a leaf. We INTENTIONALLY do NOT add the hub
  # to the `grappa-e2e` bridge here, and we do NOT alias
  # `hub.azzurra.chat` on it — doing so poisons the hub's DNS for its
  # own name across the leaf-net side: docker's embedded DNS, when a
  # container is multi-homed and the same alias is registered on
  # multiple networks, returns the alias's address on the network with
  # the highest internal precedence (empirically the most-recently
  # attached one), so leaf4 querying `hub.azzurra.chat` gets the hub's
  # `grappa-e2e` IP — which leaf4 has no route to — and the autoconnect
  # fails with "No C/N conf lines" hub-side because the inbound source
  # IP doesn't match any C: line. Symptom is split-mode permanently
  # active leaf-side: 0 servers in /STATS, no auto-op on JOIN, MODE
  # rejected with 482. Keep the hub OFF grappa-e2e and only the leaf
  # carries the `bahamut-test` alias for client traffic.
  hub:
    ports: !override []

  # Per vjt: client connections (both grappa-test the bouncer AND the
  # playwright-runner peer) ALWAYS go to a leaf, never the hub. Hubs
  # are S2S routers; user-facing IRC servers are leaves. The
  # `bahamut-test` alias here is the ONE name everything points at.
  leaf-v4:
    ports: !override []
    networks:
      leaf4-net: null
      grappa-e2e:
        aliases: [leaf4.azzurra.chat, bahamut-test]

  leaf-v6:
    ports: !override []

  # GH #349 — turn ON the azzurra/services outbound AUTH mail for the
  # registration-wizard e2e, and put services on the grappa-e2e bridge so
  # its msmtp shim can reach the mailpit sink (`mailpit:1025`). The
  # submodule image is env-gated (SVC_EMAIL default 0 keeps the standalone
  # testnet mail-free); here we flip EMAIL + FORCE_AUTH on so a fresh
  # REGISTER must AUTH with the emailed code before the nick goes +r —
  # exactly the flow the wizard spec drives + asserts. `svc-net: null`
  # preserves the submodule's static-IP S2S link to the hub (same pattern
  # as the leaf-v4 override above); grappa-e2e is added for mailpit reach.
  services:
    environment:
      SVC_EMAIL: "1"
      SVC_FORCE_AUTH: "1"
      # services' validate_email() rejects the .test TLD; use the real
      # services network domain (azzurra.chat) for the envelope-from.
      SVC_RETURN: "noreply@azzurra.chat"
      # GH #349 — DISABLE services' clone-autokill (conf.c CLONES →
      # CONF_AKILL_CLONES; default 5, expiry 600s). grappa is a BOUNCER:
      # bahamut-test + azzurra + azzurra-reg sessions ALL link to this one
      # hub from grappa's single container IP, so services see them as
      # clones and autokill the IP on the 5th connection — a false positive
      # that turns the FULL suite red from a hard cliff (Autokilled →
      # session :failed → resetSubject 500 → live-IRC specs time out).
      # main sits at 4 concurrent (margin-of-1); azzurra-reg is the +1 that
      # tips it. 0 = akill off (detection/globops still run). This testnet
      # is single-tenant + hermetic — there are no real clones to police.
      SVC_AKILL_CLONES: "0"
    networks:
      svc-net: null
      grappa-e2e:
        aliases: [services, services.azzurra.chat]

  # #211 phase 7 / #221 — a SECOND, SEPARATE IRC network: a standalone
  # ircd with its OWN nick namespace (NOT linked to the azzurra hub). This
  # is what makes "one visitor on TWO networks" a REAL two-network test
  # rather than the same leaf twice: azzurra points at `bahamut-test` (the
  # azzurra hub's leaf), azzurra2 points HERE. Because the two ircds share
  # no S2S link, they have INDEPENDENT nick namespaces — the SAME nick can
  # register live on BOTH simultaneously with no 433, so the shared-leaf
  # autokill trap (nick collision → 433 respawn flood → autokill) never
  # fires.
  #
  # #221 — this node runs SOLANUM (github.com/solanum-ircd/solanum), the
  # ircd Libera.Chat runs, IN PLACE of the second bahamut. It gives the
  # integration suite a real Libera-shaped upstream so grappa's parser is
  # exercised against the actual WHOIS numeric set, on-connect usermodes,
  # and WHO-mask round-trip that #221 fixes — not a bahamut mock. It is
  # standalone (no S2S), plaintext-only (grappa dials `--no-tls`), and
  # keeps the `bahamut-test2` network alias so the azzurra2 seed +
  # multi-network specs resolve the same hostname (zero blast radius on
  # the #211 phase-6/7 specs — only the ircd behind the name changed).
  solanum-test2:
    build:
      context: ./infra-solanum
      args:
        SOLANUM_REF: ${SOLANUM_REF:-main}
    container_name: azzurra2-solanum
    hostname: solanum2.azzurra2.chat
    environment:
      SERVER_NAME: solanum2.azzurra2.chat
      SERVER_SID: "2SO"
      SERVER_DESC: "Grappa e2e second network (solanum, standalone)"
      OPER_NICK: ${OPER_NICK:-testoper}
      OPER_PASS: ${OPER_PASS:-testoperpass}
    # #221 — solanum's authd resolver reads /etc/resolv.conf once at boot
    # and DIES ("DNS: no name servers") if it can't parse a usable
    # nameserver; a dead authd stalls EVERY non-loopback client
    # registration (a network peer gets zero bytes back). Docker's default
    # resolv.conf adds `options ndots:0`, which authd's minimal parser
    # chokes on. Pin a clean nameserver (docker's embedded resolver) with
    # NO options so authd stays alive and clients register promptly —
    # rDNS still fails gracefully per-connection, which is fine.
    dns:
      - 1.1.1.1
    dns_opt: []
    # Cap the file-descriptor limit. solanum/librb sizes its per-fd table
    # to RLIMIT_NOFILE at boot; a container that inherits the host's
    # systemd LimitNOFILE (≈1e9 on modern docker, e.g. Debian's
    # docker.io 26.x) makes librb try to allocate GBs and abort with
    # "librb has called the restart callback: Out of Memory" → SIGSEGV
    # (exit 139), even with the box's RAM near-empty. Older docker-ce
    # defaulted nofile to 1024:524288 so the crash never surfaced there;
    # pinning a sane bound here makes the second-network ircd boot on any
    # host regardless of the daemon's default. Harmless where nofile is
    # already sane. (Diagnosed 2026-07-19 on a docker.io 26.1.5 box.)
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    networks:
      grappa-e2e:
        # Keep the `bahamut-test2` alias (#221): the azzurra2 seed + the
        # #211 multi-network specs point at this name. Only the ircd behind
        # it changed (bahamut → solanum), not the network topology.
        aliases: [solanum-test2, bahamut-test2]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6667'"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 40

  # One-shot seeder. Boots the schema (ecto.migrate) and writes the
  # baseline (one user `vjt` + one bahamut-test bind w/ autojoin
  # `["#bofh"]`) into the e2e_runtime sqlite DB BEFORE grappa-test
  # starts — so when grappa-test's Bootstrap reads the credentials,
  # the row is already there and the upstream IRC session spawns
  # immediately.
  #
  # Why a sidecar instead of running mix tasks from the runner:
  #   - Boundary: the runner is a pure REST/IRC client, not a
  #     container manager. `docker exec` from inside a container
  #     requires either docker.sock mount (privilege escalation) or
  #     a separate docker daemon (CI complication). The sidecar is
  #     the same image as grappa-test and shares the e2e_runtime
  #     volume — it's a normal mix-task invocation, not a remote
  #     control surface.
  #   - Production fidelity: matches the operator's prod ritual
  #     (mix grappa.create_user / mix grappa.bind_network) verbatim,
  #     so a mix-task regression surfaces here first.
  #
  # Hardcoded creds are TEST-ONLY (the e2e_runtime DB is wiped on
  # every `compose down -v`); see fixtures/seedData.ts for the
  # constants the runner reads back.
  grappa-e2e-seeder:
    build:
      context: ../..
      args:
        CONTAINER_UID: ${CONTAINER_UID:-1000}
        CONTAINER_GID: ${CONTAINER_GID:-1000}
    image: grappa:e2e
    pull_policy: never
    container_name: grappa-e2e-seeder
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    working_dir: /app
    volumes:
      - ../..:/app
      - ../../runtime/e2e/grappa-runtime:/app/runtime
    environment:
      MIX_ENV: dev
      ELIXIR_ERL_OPTIONS: "+fnu"
      GRAPPA_CAPTCHA_PROVIDER: disabled
    command:
      - "sh"
      - "-c"
      - |
        set -e
        # `.mix/`, `.hex/`, `deps/`, `_build/` all live under the
        # bind-mounted `../..:/app`; the image is toolchain-only (#364
        # docker S1) and bakes none of them, so this seeder installs them
        # into the mounted tree — and MUST run before grappa-test boots
        # (enforced by scripts/integration.sh's two-phase up). CP23 S1
        # lessons (memories `feedback_named_volume_uid_trap` +
        # `feedback_bind_mount_shadows_image`): named volumes for these
        # dirs init root-owned and trip the dropped UID; a bind-mount with
        # explicit `mix local.hex` + `mix deps.get` is the idempotent fix.
        # First run is cold (compile from scratch), subsequent runs reuse
        # the bind-mounted host `_build/`.
        mix local.hex --force
        mix local.rebar --force
        mix deps.get
        mix ecto.create
        mix ecto.migrate
        # #75 — seed the curated built-in theme gallery (system-owned,
        # published) so the themes gallery e2e has rows to browse + apply.
        # Idempotent upsert; safe under the seeder's re-run guard.
        mix grappa.seed_themes
        mix grappa.create_user --name vjt --password test-password-not-secret
        mix grappa.bind_network --user vjt --network bahamut-test \
          --server bahamut-test:6667 --no-tls --nick vjt-grappa \
          --auth none --autojoin '#bofh'
        mix grappa.seed_scrollback --user vjt --network bahamut-test \
          --channel '#bofh' --count 200 --sender seed-bot
        # M-cluster M-7 — second seeded user with is_admin=true so the
        # admin-gate Playwright spec can compare admin vs non-admin
        # vs visitor visibility. No --admin flag on create_user (M-7
        # is cic-only — server-task change is out of scope); promote
        # via Accounts.update_admin_flags/2 from a mix run. The bind
        # is the same network so the admin can log in and have the
        # same surface as vjt.
        mix grappa.create_user --name admin-vjt --password test-password-not-secret
        mix run -e 'user = Grappa.Repo.get_by!(Grappa.Accounts.User, name: "admin-vjt"); {:ok, _} = Grappa.Accounts.update_admin_flags(user, %{is_admin: true})'
        # M-cluster M-9b — third seeded user, bound to bahamut-test so
        # Bootstrap spawns a live Session.Server at boot. The M-9b
        # e2e logs in as admin-vjt and hits POST /admin/sessions/...
        # /disconnect against THIS user's session (vjt's session is
        # reserved for non-admin specs; admin-vjt has no bind and
        # can't be targeted as a "real" disconnect because the M-9a
        # cannot_disconnect_self 422 gate fires). Pre-seed at compose
        # time so Bootstrap spawns the Session.Server before the
        # Playwright suite starts.
        mix grappa.create_user --name m9b-test --password test-password-not-secret
        mix grappa.bind_network --user m9b-test --network bahamut-test \
          --server bahamut-test:6667 --no-tls --nick m9b-grappa \
          --auth none --autojoin '#bofh'
        # GREEN-CI batch-1 — sacrificial-user for the destructive admin
        # specs (m9b Disconnect/Terminate, u5 Terminate). Disconnect
        # parks the credential; Terminate kills the pid. Each spec
        # PATCHes /networks first to reconnect (idempotent) so the row
        # is guaranteed live before the destructive verb fires. vjt
        # and m9b-test stay alive for downstream specs.
        mix grappa.create_user --name m9b-victim --password test-password-not-secret
        mix grappa.bind_network --user m9b-victim --network bahamut-test \
          --server bahamut-test:6667 --no-tls --nick m9b-victim-grappa \
          --auth none --autojoin '#bofh'
        # #498 — dedicated user for the badge-follows-live-nick witness
        # (b-runtime). The witness renames a session's LIVE nick — a
        # destructive mutation of server-side identity — so it must never
        # touch the shared vjt session (#477-avoided class). It gets its OWN
        # user, but the SESSION is accreted + parked INSIDE the spec, NOT
        # seeded live here: a boot-live i498 session would sit in the steady
        # state that m9b (leak canary) + u-z-cap (user-cap) assert AFTER it,
        # reddening BOTH the full suite and scoped `--grep m9b` iso reruns (a
        # fixture that only works at full-suite scope is not a fixture). The
        # spec accretes `azzurra` at runtime (visitor_enabled + SAME leaf as
        # bahamut-test → the peer sees it with no extra wiring, and it
        # consumes NO bahamut-test user-cap slot), default nick `i498-user`
        # (unique across the seeded set → no shared-leaf 433), joins its own
        # channel, and parks on teardown. The seeder creates only the USER.
        mix grappa.create_user --name i498-user --password test-password-not-secret
        # #630 — sacrificial victim for the inbound-flood-protection e2e. The
        # flood ladder SEVERS (revokes the bearer + closes the socket) the
        # flooded subject, so the spec targets THIS throwaway user, never the
        # shared vjt (a sever on vjt cascaded auth-death across every
        # downstream vjt spec). NO bind_network: it only needs a web session
        # to flood /me writes + be severed, so it consumes no bahamut-test
        # user-cap slot and never surfaces in the /admin/sessions leak canary.
        mix grappa.create_user --name flood-victim --password test-password-not-secret
        # GREEN-CI batch-1 — bahamut-test user cap defaults to 3, which
        # is exactly the seeded-user count (vjt + m9b-test + m9b-victim).
        # The victim-reconnect PATCH in destructive specs would 503
        # `network_busy` if a prior spec's parked session hadn't yet
        # dropped its registry slot. Bump to 10 so the destructive-spec
        # reconnect-then-kill dance has headroom; the U-cluster spec
        # which exercises the cap-saturation 503 boundary explicitly
        # PATCHes its own caps in setup, so this baseline doesn't
        # conflict with it.
        mix grappa.set_network_caps --network bahamut-test --max-user-sessions 10
        # M-cluster M-8 — visitor mint endpoint (`POST /auth/login`
        # with `{identifier: nick}`) requires a VISITOR-ENABLED
        # Networks.Network row PLUS at least one Server row so the visitor
        # session can spawn an upstream IRC connection.
        #
        # #211 phase 3 — the compile-time `:visitor_network` pin is GONE:
        # which networks accept visitors is now the runtime DB flag
        # `networks.visitor_enabled`, read by login via
        # `Networks.list_visitor_enabled/0`. So the seeded "azzurra"
        # network MUST be created with `visitor_enabled: true` (via the
        # idempotent `find_or_create_network/1`) or every visitor spec
        # 503s `network_unconfigured` at login. Points at the same
        # bahamut-test leaf. No credential bind here — visitor minting
        # provisions its own anon visitor rows (+ their per-network
        # Credential via the phase-3 write-through) at request time.
        #
        # #171: `max_per_ip: 100` is deliberate headroom, not a real
        # limit. The per-(source-IP, network) clone cap reuses
        # `max_per_ip`, and the serial Playwright runner drives many
        # visitor logins through ONE shared source IP (runner → nginx →
        # grappa). At the production default (1) the 2nd concurrent
        # visitor on the shared IP would 503 `too_many_sessions`,
        # regressing unrelated specs. Specs that need a tight cap set it
        # explicitly and restore to 100 (issue171 spec, u-4).
        mix run -e '{:ok, _net} = Grappa.Networks.find_or_create_network(%{slug: "azzurra", visitor_enabled: true, visitor_autoconnect: true, max_concurrent_visitor_sessions: 100, max_per_ip: 100})'
        mix grappa.add_server --network azzurra --server bahamut-test:6667 --no-tls
        # #211 phase 6/7 — a SECOND visitor_enabled network (azzurra2) + a
        # THIRD (azzurra3). azzurra2 points at `bahamut-test2` — a SEPARATE
        # standalone ircd with its OWN nick namespace (#211 phase 7), so a
        # visitor can hold a LIVE session on azzurra AND azzurra2
        # simultaneously under the same or different nick with NO 433 /
        # no shared-leaf autokill. #221: that ircd is now SOLANUM (the
        # `bahamut-test2` alias is retained on the solanum-test2 service, so
        # this add_server line is unchanged — only the ircd behind the name
        # switched from bahamut to solanum). azzurra3 stays on the shared
        # `bahamut-test` leaf (the phase-6 matrix uses it for accretion
        # only, never live-simultaneous with azzurra). Both are
        # visitor_enabled but NOT visitor_autoconnect BY DEFAULT: making
        # them autoconnect in the SHARED seed would multiply every visitor
        # spec's upstream connection count. The phase-6 matrix spec flips
        # azzurra2 → visitor_autoconnect in its OWN setup (admin PATCH), so
        # the multi-network autoconnect cost is isolated to that spec.
        # Default visitor = ONE connection (azzurra) — zero blast radius on
        # the rest of the suite.
        mix run -e '{:ok, _net} = Grappa.Networks.find_or_create_network(%{slug: "azzurra2", visitor_enabled: true, visitor_autoconnect: false, max_concurrent_visitor_sessions: 100, max_per_ip: 100})'
        mix grappa.add_server --network azzurra2 --server bahamut-test2:6667 --no-tls
        mix run -e '{:ok, _net} = Grappa.Networks.find_or_create_network(%{slug: "azzurra3", visitor_enabled: true, visitor_autoconnect: false, max_concurrent_visitor_sessions: 100, max_per_ip: 100})'
        mix grappa.add_server --network azzurra3 --server bahamut-test:6667 --no-tls
        # GH #349 — dedicated user + network for the registration-wizard
        # real-services e2e. `azzurra-reg` is services_flavor=azzurra (drives
        # the cic wizard's Azzurra REGISTER/AUTH templates) and points at the
        # bahamut-test leaf → azzurra hub → the (now email-enabled) services.
        # --auth none + a FRESH unregistered nick so the user connects NOT
        # +r → the "Register nick" button shows; the spec registers the nick,
        # reads the AUTH code from mailpit, sends AUTH <code>, and asserts +r.
        # An ISOLATED user so the new button has zero blast radius on the
        # other HomePane specs (which run as vjt).
        mix grappa.create_user --name wiz-test --password test-password-not-secret
        mix grappa.bind_network --user wiz-test --network azzurra-reg \
          --services-flavor azzurra --server bahamut-test:6667 --no-tls \
          --nick wiz-reg-nick --auth none
        # #405 — a FRESH non-admin account with NO network bind, for the
        # first-login journey e2e (issue405-fresh-account-journey.spec.ts).
        # Deliberately NO bind_network + NO --admin: this is the "brand-new
        # account an operator just created, before binding any network" case.
        # The spec logs in via the cic form with the BARE name (no `@`) to
        # exercise the #404 dispatch fix end-to-end, then asserts the USER
        # (not guest) empty-networks home state. NOT added to the runner's
        # globalSetup (fixtures/seedData.ts) — the spec drives the real login
        # itself; seeding a token here would defeat the point.
        mix grappa.create_user --name fresh405 --password test-password-not-secret
        # #481 — dedicated user for the self-serve accretion e2e
        # (issue481-user-accretion.spec.ts). NO bind_network: post-#481 a
        # USER with zero networks sees the `visitor_enabled` self-serve tier
        # on home and one-taps azzurra2 (solanum → independent namespace, no
        # 433 trap) to connect it LIVE. Isolated (own user) so the live
        # session it leaves on azzurra2 has zero blast radius on the other
        # specs. Logged in + token-stashed by the runner's globalSetup
        # (fixtures/seedData.ts ACCRETE_*), unlike fresh405.
        mix grappa.create_user --name accr481 --password test-password-not-secret
        # #1038 — dedicated user for the cross-network mute e2e
        # (issue1038-mute-is-per-network.spec.ts). NO bind_network: the spec
        # accretes azzurra AND azzurra2 at runtime, because it needs ONE
        # subject holding the SAME channel name on TWO networks — the only
        # shape that can tell a network-keyed mute from a network-blind one.
        # The two slugs sit on DIFFERENT ircds (bahamut-test / bahamut-test2),
        # so the two sessions cannot collide on nick
        # (feedback_e2e_multinet_live_needs_distinct_nicks) and the same
        # channel name really is two conversations rather than one.
        # Isolated from vjt on purpose: the auto `resetSubject` after every
        # test re-spawns every credential a subject holds and never deletes
        # extra ones, so accreting onto the shared vjt would leave two
        # permanent sessions and redden the admin-sessions leak canary.
        mix grappa.create_user --name mute1038 --password test-password-not-secret
    networks:
      grappa-e2e: {}

  grappa-test:
    build:
      context: ../..
      args:
        CONTAINER_UID: ${CONTAINER_UID:-1000}
        CONTAINER_GID: ${CONTAINER_GID:-1000}
    image: grappa:e2e
    pull_policy: never
    container_name: grappa-e2e-grappa
    hostname: grappa-test
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    working_dir: /app
    depends_on:
      hub:
        condition: service_healthy
      # #211 phase 7 / #221 — the second standalone ircd (now solanum) must
      # be up before Bootstrap spawns the azzurra2 credential's upstream
      # session.
      solanum-test2:
        condition: service_healthy
      # #485 — grappa self-serves the SPA now (dumb-proxy nginx), so the
      # built dist must exist before grappa boots. cicchetto-build-test is a
      # oneshot; re-running its bun build is idempotent (unlike the seeder),
      # so this dep is safe under scripts/integration.sh's `up --wait`.
      cicchetto-build-test:
        condition: service_completed_successfully
      # NOTE: deliberately NO `depends_on grappa-e2e-seeder
      # service_completed_successfully` here. With the dep declared,
      # `compose up grappa-test --wait` re-starts the (already-exited
      # zero) seeder a SECOND time, which fails on the duplicate user
      # row and trips the whole stack. The seeder is orchestrated
      # entirely from scripts/integration.sh's two-phase boot sequence
      # (phase 1: `up --wait grappa-e2e-seeder`; phase 2: `up --wait
      # grappa-test ...`) so this dep is enforced by the wrapper, not
      # compose semantics.
    volumes:
      # Bind-mount source from the worktree root (../..). Same shape as
      # compose.yaml — live source, not a release. Named volumes for
      # _build / deps / .mix / .hex were dropped post-CP23 S1: the
      # single-stage `mix phx.server` model never runs as root, and
      # named volumes initialise root-owned (memory
      # `feedback_named_volume_uid_trap`), tripping the dropped UID's
      # writes to deps/_build. Bind-mount inherits operator UID, no
      # collision.
      - ../..:/app
      # Per-stack runtime (sqlite). Host bind-mount under
      # runtime/e2e/grappa-runtime so the directory ownership matches
      # the operator's UID — same gotcha as bun-cache + cicchetto-dist
      # (see cicchetto-build-test): a fresh named volume is root-owned
      # and the container drops to UID 1000, causing the sqlite open
      # to fail with `database_open_failed`. Bind-mount inherits the
      # host UID via Docker Desktop's translation on macOS / direct
      # uid-match on Linux.
      - ../../runtime/e2e/grappa-runtime:/app/runtime
      # #485 — the built SPA dist the BEAM self-serves (dumb-proxy nginx).
      # Same host dir cicchetto-build-test writes + the runner's bundleSwap
      # fixture mutates; RO here (grappa only reads it). NOT under /app/runtime
      # (that mount point is overridden by grappa-runtime above).
      - ../../runtime/e2e/cicchetto-dist:/app/cicchetto-dist:ro
    environment:
      MIX_ENV: dev
      ELIXIR_ERL_OPTIONS: "+fnu"
      # #485 — self-serve the built SPA from the mounted dist (see volumes).
      CIC_DIST_ROOT: /app/cicchetto-dist
      # Captcha disabled — the test suite drives signup directly via
      # mix tasks; the captcha gate is a separate spec when it lands.
      GRAPPA_CAPTCHA_PROVIDER: disabled
      # Public-origin fidelity (media-link viewer, 2026-06-11): the
      # runtime.exs PHX_HOST block roots Endpoint.url() at
      # https://nginx-test so minted upload URLs match the page origin
      # the Playwright runner browses — same shape as prod, where
      # PHX_HOST roots them at the public https host.
      PHX_HOST: nginx-test
      # #324 media-alias e2e: advertise a synthetic sibling hostname
      # alongside PHX_HOST so `Grappa.HttpHosts` (via runtime.exs) exposes
      # http_host_aliases = [nginx-test, alias-b.test]. The
      # media-link-alias spec composes a body carrying
      # `https://alias-b.test/uploads/<slug>` (a host that is NOT the page
      # origin) and asserts the in-app viewer opens re-rooted onto the
      # page origin. Harmless for other specs (no browser reaches
      # alias-b.test; MIX_ENV=dev leaves check_origin=false anyway).
      EXTRA_CHECK_ORIGINS: "https://alias-b.test"
    command: ["mix", "phx.server"]
    networks:
      grappa-e2e:
        # Alias so nginx-test can proxy to us via the `grappa` hostname the
        # shared proxy snippet's upstream resolves — lets the e2e nginx reuse
        # infra/snippets/locations-api.conf verbatim (#485 dumb proxy), no
        # e2e-specific nginx config drift.
        aliases: [grappa, grappa-test]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 30

  cicchetto-build-test:
    # oven/bun digest-pinned (#103). Refresh on a bump:
    # docker buildx imagetools inspect oven/bun:1 --format '{{.Manifest.Digest}}'
    image: oven/bun:1@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
    # Use the operator's UID/GID so writes to the bind-mounted host
    # cache dir + the dist named volume match host ownership. Mirrors
    # scripts/bun.sh's --user pattern. CONTAINER_UID/GID are exported
    # by scripts/integration.sh on Linux; on macOS they default to
    # 1000 and Docker Desktop's bind-mount layer translates ownership
    # transparently — the cache works either way because it lives in
    # a host bind-mount that already exists with the operator's UID
    # (see scripts/integration.sh's mkdir -p in the prelude).
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    working_dir: /app
    volumes:
      - ../../cicchetto:/app
      # Host bind-mount for the bun install cache, shared with the
      # dev `scripts/bun.sh` cache at runtime/bun-cache. Named volume
      # would be root-owned on first create → AccessDenied under the
      # dropped UID; bind-mount inherits the operator's ownership.
      - ../../runtime/bun-cache:/cache
      # Host bind-mount for the dist output too — same reason. Lives
      # under runtime/e2e/cicchetto-dist (separate from the prod
      # deploy's runtime/cicchetto-dist so they can't collide).
      - ../../runtime/e2e/cicchetto-dist:/app/dist
    tmpfs:
      - /tmp:exec,uid=${CONTAINER_UID:-1000},gid=${CONTAINER_GID:-1000}
    environment:
      HOME: /tmp
      BUN_INSTALL_CACHE_DIR: /cache
      # #538 — vite bakes this into <meta cicchetto-version> (bundle-refresh
      # e2e asserts the tag). This container mounts only ../../cicchetto, so it
      # cannot read mix.exs; scripts/integration.sh derives it from mix.exs
      # @version (infra/packaging/version.sh) and exports it before compose.
      GRAPPA_VERSION: ${GRAPPA_VERSION:-}
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run build"]

  # nginx-cert-init — push notifications cluster B5 (2026-05-14).
  # Generates a throwaway self-signed cert for nginx-test's :443
  # listener so the cic SW + Push API + Notification API have a
  # secure context to register against. Idempotent: subsequent
  # `up` runs reuse the existing cert. See
  # nginx-certs/gen-cert.sh moduledoc for why TLS is the
  # canonical path (chromium HTTP treat-as-secure flag does not
  # honor Playwright's launch shape).
  nginx-cert-init:
    image: alpine:3.20
    user: "0:0"
    volumes:
      - ./nginx-certs:/certs
    command: ["/bin/sh", "/certs/gen-cert.sh"]

  nginx-test:
    # nginx:alpine digest-pinned (#103 — `alpine` floats). Refresh on a bump:
    # docker buildx imagetools inspect nginx:alpine --format '{{.Manifest.Digest}}'
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    container_name: grappa-e2e-nginx
    hostname: nginx-test
    depends_on:
      grappa-test:
        condition: service_healthy
      nginx-cert-init:
        condition: service_completed_successfully
    # #485 — dumb reverse proxy: no dist mount (the BEAM self-serves the SPA
    # now) and no cicchetto-build-test dep (moved to grappa-test, the new
    # dist consumer). Just the proxy config + the shared snippet + TLS certs.
    volumes:
      - ./nginx-test.conf:/etc/nginx/nginx.conf:ro
      - ../../infra/snippets:/etc/nginx/snippets:ro
      - ./nginx-certs:/etc/nginx/certs:ro
    networks:
      grappa-e2e:
        aliases: [nginx-test]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 30

  # The runner. Official Playwright base image (Node + chromium/
  # firefox/webkit preinstalled). Has direct docker-network access to
  # hub (`bahamut-test:6667` via the hub alias) and nginx-test
  # (`http://nginx-test:80`). No host port publish — the runner exits
  # on its own and `--abort-on-container-exit` tears the whole stack
  # down with it.
  playwright-runner:
    build:
      context: .
      dockerfile: ./runner/Dockerfile
    container_name: grappa-e2e-runner
    depends_on:
      nginx-test:
        condition: service_healthy
      push-catcher:
        condition: service_healthy
      # GH #349 — the registration-wizard e2e polls mailpit's HTTP API
      # for the NickServ confirmation mail. Distroless image → no
      # healthcheck; service_started is enough (boots sub-second, nothing
      # reads it until a spec sends mail).
      mailpit:
        condition: service_started
    volumes:
      # Source mount so spec edits hot-reload without rebuild.
      - .:/work
      # Preserve the image's pre-installed node_modules over the
      # bind-mount above. Without this, `.:/work` overlays /work
      # entirely, hiding the npm install done at build time, and
      # Playwright fails with "Cannot find package '@playwright/
      # test'". Named volume seeds itself from the image on first
      # mount.
      - e2e_runner_node_modules:/work/node_modules
      # Persist Playwright HTML reports + traces to host for post-
      # mortem (test-results/ + playwright-report/ — gitignored at
      # cicchetto/e2e/.gitignore).
      - ./test-results:/work/test-results
      - ./playwright-report:/work/playwright-report
      # UX-6-I.2 (2026-05-22) — real-bundle-swap fixture mounts the
      # cic dist tree RW so the swap fixture can rewrite index.html +
      # drop a synthetic bundle B asset mid-spec. #485 — grappa-test
      # mounts the same host path RO (it self-serves the SPA now); the
      # host file is the single source of truth, both containers see the
      # same bytes. See cicchetto/e2e/fixtures/bundleSwap.ts.
      - ../../runtime/e2e/cicchetto-dist:/work/dist-test
    working_dir: /work
    environment:
      CI: "1"
      # The base URL specs hit. `nginx-test` resolves via the docker
      # bridge (alias defined on the nginx-test service above). HTTPS
      # is required for the cic SW + Push API + Notification API to
      # surface (push notifications cluster B5, 2026-05-14) — the
      # nginx-test container exposes both :80 (legacy specs) and
      # :443 (self-signed cert via nginx-certs).
      E2E_BASE_URL: https://nginx-test
      # Hub address for ircClient.ts fixture — talks plain IRC to the
      # bahamut-test alias.
      E2E_IRC_HOST: bahamut-test
      E2E_IRC_PORT: "6667"
      # Verbose IRC peer wire-trace. Off by default; export
      # `E2E_PEER_DEBUG=1` on the host before scripts/integration.sh to
      # surface every RPL_*/ERR_*/NOTICE + socket-close per peer — the
      # seam for debugging registration / nick collision / throttle
      # issues without editing this file each time.
      E2E_PEER_DEBUG: "${E2E_PEER_DEBUG:-0}"
      # Push notifications cluster B5 (2026-05-14) — base URL the
      # push-trigger specs use for both (a) constructing the fake
      # PushSubscription endpoint cic registers and (b) polling
      # `/received/<id>` to confirm Sender's HTTP POST landed.
      # See push-catcher/server.mjs for the path scheme.
      E2E_PUSH_CATCHER_URL: http://push-catcher:3000
      # GH #349 — mailpit HTTP API base for the registration-wizard e2e.
      # Specs GET /api/v1/messages (list) + /api/v1/message/{id} (body)
      # to extract the NickServ confirmation code/link.
      E2E_MAILPIT_URL: http://mailpit:8025
    networks:
      grappa-e2e: {}
    command: ["npx", "playwright", "test"]

  # GH #349 registration wizard — mailcatcher for the real-services
  # NickServ registration e2e. The wizard fires `REGISTER <pw> <email>`
  # at a REAL services daemon (Azzurra IRC Services / Atheme /
  # oftc-ircservices), which mails a confirmation code (Atheme/Azzurra)
  # or web link (OFTC). Each services daemon's sendmail shim is pointed
  # at mailpit's SMTP (`mailpit:1025`); the Playwright spec polls
  # mailpit's HTTP API (`http://mailpit:8025/api/v1/...`) for the mail,
  # extracts the code/link, and completes verification programmatically →
  # the registration truly closes (nick goes +r), zero manual step,
  # self-contained in CI. Same sidecar shape as push-catcher: a stock
  # image with zero production-code surface, reachable only intra-network.
  #
  # `axllent/mailpit` is a distroless image (no shell), so no CMD-SHELL
  # healthcheck; the runner + services depend on it with the default
  # `service_started` condition. mailpit boots in well under a second and
  # nothing polls it until a spec sends mail, long after boot.
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: grappa-e2e-mailpit
    environment:
      # Accept mail for any recipient; keep everything in memory (wiped
      # on teardown, like the rest of the e2e state).
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "0"
    networks:
      grappa-e2e:
        aliases: [mailpit]

  # Push notifications cluster B5 (2026-05-14) — fake Web Push vendor
  # for the e2e push-trigger specs. See push-catcher/server.mjs
  # for the rationale (no real FCM / Mozilla autopush reachable from
  # the integration network; sidecar plays the vendor role with zero
  # production-code surface). Stdlib-only node server, no npm install.
  push-catcher:
    build:
      context: ./push-catcher
    image: grappa-e2e-push-catcher:dev
    container_name: grappa-e2e-push-catcher
    pull_policy: never
    networks:
      grappa-e2e:
        aliases: [push-catcher]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10

volumes:
  e2e_runner_node_modules:

networks:
  # Single shared bridge so runner can reach grappa-test, nginx-test,
  # and hub (via the alias declared on hub's `networks:` override
  # above). The testnet's internal svc-net / leaf4-net / leaf6-net
  # bridges keep doing their S2S job — those are inherited from
  # infra/compose.yaml unchanged. We just add hub to one more bridge
  # (grappa-e2e) so it's reachable from grappa-test + the runner.
  grappa-e2e:
    driver: bridge
