# nginx config for e2e nginx-test.
#
# #485 collapsed this to a DUMB reverse proxy (like the native Linux
# substrate). The BEAM (grappa-test) self-serves the SPA + static +
# PWA manifest and OWNS every security header
# (GrappaWeb.Plugs.SecurityHeaders); this nginx only terminates TLS on :443
# (so the cic SW + Push + Notification APIs get a secure context — W3C gates
# them on isSecureContext) and forwards everything to grappa-test:4000. The
# :80 listener stays for legacy specs that hit http://nginx-test.
#
# Both server blocks include the shared substrate-agnostic proxy snippet
# (../../infra/snippets bind → /etc/nginx/snippets) — the single source of
# truth with infra/linux/nginx.conf. That is why
# the CSP + Range parity specs still exercise the REAL prod surface: the
# headers arrive from the BEAM through this proxy, byte-identical.

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;

    # Access-log shape — the same snippet the native-host substrate includes
    # (#1029), so a diagnosis rehearsed here reads like the production one.
    # http context: `log_format` is not valid inside `server { }`. Resolved
    # from the ../../infra/snippets bind mount, like locations-api.conf.
    include /etc/nginx/snippets/log-format.conf;

    upstream grappa_upstream {
        server grappa:4000;
        keepalive 32;
    }

    # :80 — plain HTTP, retained for backwards-compat with non-push specs.
    server {
        listen 80 default_server;
        server_name _;

        include /etc/nginx/snippets/locations-api.conf;
    }

    # :443 — TLS, throwaway self-signed cert. Push specs hit this surface
    # via E2E_BASE_URL=https://nginx-test on the runner.
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        include /etc/nginx/snippets/locations-api.conf;
    }
}
