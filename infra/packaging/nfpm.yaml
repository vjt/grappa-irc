# nfpm config — builds the grappa .deb AND .rpm from the staging tree
# assembled by build.sh. nfpm is a single Go binary (no dpkg/rpmbuild
# toolchain, no host hex) that renders the SAME staging tree into either
# format; build.sh picks the format via GRAPPA_PKG_FORMAT and nfpm's `-p`.
#
# The FORMAT is just a flag — the PAYLOAD is not. The release bundles ERTS +
# crypto NIFs linked against the BUILD host's glibc/libssl, so a Debian-built
# payload is a valid .deb but not a valid .rpm: build each format on its own
# distro (the .rpm in a Fedora container, the .deb on the Debian runner).
#
# ${GRAPPA_VERSION} / ${GRAPPA_PKG_ARCH} are expanded from the environment
# build.sh exports.

name: grappa
arch: ${GRAPPA_PKG_ARCH}
platform: linux
version: ${GRAPPA_VERSION}
section: net
priority: optional
maintainer: "Marcello Barnaba <vjt@users.noreply.github.com>"
vendor: "Marcello Barnaba"
homepage: "https://github.com/vjt/grappa-irc"
license: "MIT"
description: |
  Always-on IRC bouncer with a REST + Phoenix Channels API and a bundled
  irssi-shaped web PWA (cicchetto). One supervised OTP process per
  (user, network); sqlite-backed scrollback. Ships a self-contained
  Erlang/OTP release and self-serves the web frontend, so nginx is
  recommended for TLS but not required.
  The terminal client (shottino) is its OWN package since 1.3.0 — install
  it anywhere, with or without this server (#1447).

# Runtime deps are per-format (disjoint package names across distro
# families), so they live under `overrides` — NOT top-level `depends`,
# which nfpm would apply to BOTH formats. What they cover is the bundled
# ERTS and the maintainer scripts; the terminal client declares its own
# (nfpm-shottino.yaml) since it stopped riding along in 1.3.0.
#
# recommends: the media-metadata strip shells out to exiftool/ffmpeg
# fail-closed (without them uploads 422), and nginx is the recommended
# TLS/static front. All soft — the bouncer boots and serves without any of
# them, and a Recommends whose package is absent from the enabled repos is
# silently ignored (matters for ffmpeg on Fedora: it lives in RPM Fusion,
# not base, so it stays a best-effort weak dep).
overrides:
  deb:
    depends:
      # libncurses6 is for ERTS, and it is the NARROW build. The WIDE
      # libncursesw6 used to sit beside it for shottino; it left with the
      # binary in 1.3.0 (#1447) and is declared by the client's own package
      # now. Debian ships the two separately, so a dependency kept here for a
      # file this package no longer contains would be a claim about someone
      # else's payload. (Fedora folds both SONAMEs into one ncurses-libs, so
      # the rpm override below keeps its single entry for ERTS.)
      #
      # libssl3t64 | libssl3: Debian's 64-bit time_t transition renamed the
      # OpenSSL runtime package `libssl3` -> `libssl3t64` on Ubuntu 24.04
      # (noble) and forward, WITHOUT a `Provides: libssl3` — the pre-t64
      # names are being decrufted, so a hard-coded `libssl3` is
      # UNINSTALLABLE there. The release job builds AND `apt install`s the
      # .deb on the ubuntu-24.04 (noble) runners, and installs it on a stock
      # debian:trixie as well (#2553). The alternation resolves libssl3t64 on
      # noble/trixie, falls back to libssl3 on bookworm/pre-t64. Same
      # libssl.so.3 SONAME either way. (Bookworm resolves the dependency but
      # its glibc 2.36 cannot run the bundled ERTS — trixie is the floor.)
      - libssl3t64 | libssl3
      - libncurses6
      - libstdc++6
      - libgcc-s1
      - ca-certificates
      - passwd # provides useradd/groupadd (preinstall.sh)
      # openssl CLI: gen-secrets.sh hard-fails without it (%post). Debian
      # ships it by default (priority important) but a minbase install does
      # not, so declare it. runuser (grappa-wrapper.sh) needs NO entry here:
      # it lives in util-linux, which is Essential:yes on Debian (always
      # present) — unlike Fedora, where it is a separate package (see rpm).
      - openssl
    recommends:
      # shottino: THE UPGRADE PATH, not a suggestion. /usr/bin/shottino left
      # this package in 1.3.0 (#1447); without this entry `apt upgrade` would
      # remove the client from every host that has it today and pull nothing
      # back, because nothing else references the replacement. apt installs
      # Recommends by default, so the client arrives in the same transaction.
      - shottino
      - libimage-exiftool-perl
      - ffmpeg
      - nginx
  rpm:
    depends:
      # Fedora/RHEL package names for the SAME SONAMEs the deb depends on.
      # openssl-libs = libssl.so.3 + libcrypto.so.3; ncurses-libs is here for
      # ERTS's libncurses.so.6. Fedora folds the wide and narrow SONAMEs into
      # that one package, which is why this side needs no edit now that the
      # client (libncursesw.so.6) has left — unlike the deb, where the wide
      # build is a separate package and had to go. shadow-utils provides
      # useradd/groupadd (the deb's `passwd`); ca-certificates is the system
      # CA trust store the upstream-TLS verify_peer path reads.
      - openssl-libs
      - ncurses-libs
      - libstdc++
      - libgcc
      - ca-certificates
      - shadow-utils
      # CLI tools %post hard-requires — the ones Debian gives for free but
      # Fedora does not, so the SONAME translation above misses them:
      #   openssl:    /usr/bin/openssl for gen-secrets.sh. openssl-libs above
      #               is ONLY libssl/libcrypto; the CLI is a separate package.
      #   util-linux: /usr/sbin/runuser for the grappa wrapper's privilege
      #               drop (migrate). runuser is NOT in util-linux-core (the
      #               minimal set a cloud/container Fedora ships), so a
      #               minimal host would %post-fail without this.
      - openssl
      - util-linux
    recommends:
      # See the deb override: the client is a weak dep so that a dnf upgrade
      # brings it back in the same transaction the file leaves this package.
      # dnf installs weak deps by default (install_weak_deps=True).
      - shottino
      - perl-Image-ExifTool
      - ffmpeg
      - nginx

contents:
  # The mix release (self-contained ERTS + compiled app + boot scripts).
  - src: ./staging/usr/lib/grappa
    dst: /usr/lib/grappa

  # The built cicchetto SPA dist (CIC_DIST_ROOT points here). Read-only
  # static assets served by Plug.Static.
  - src: ./staging/usr/share/grappa/cicchetto-dist
    dst: /usr/share/grappa/cicchetto-dist

  # systemd vendor unit.
  - src: ./grappa.service
    dst: /usr/lib/systemd/system/grappa.service

  # Env template (postinstall copies to /etc/grappa/grappa.env on first
  # install) + the openssl secret generator.
  - src: ./grappa.env.example
    dst: /usr/share/grappa/grappa.env.example
  - src: ./gen-secrets.sh
    dst: /usr/share/grappa/gen-secrets.sh
    file_info:
      mode: 0755

  # Operator CLI: `grappa migrate`, `grappa remote`, `grappa gen-secrets`.
  - src: ./grappa-wrapper.sh
    dst: /usr/bin/grappa
    file_info:
      mode: 0755

  # README shipped to the doc dir (postinstall points the operator here).
  - src: ./README.md
    dst: /usr/share/doc/grappa/README.md

  # State + config dirs (owned so the daemon can write; env dir root:grappa).
  - dst: /var/lib/grappa
    type: dir
    file_info:
      mode: 0750
      owner: grappa
      group: grappa
  - dst: /etc/grappa
    type: dir
    file_info:
      mode: 0750
      owner: root
      group: grappa

# NB: /etc/grappa/grappa.env is intentionally NOT a packaged file (and
# not a conffile). postinstall creates it from the template with generated
# secrets, so an upgrade never clobbers an operator's live secrets.

scripts:
  preinstall: ./scripts/preinstall.sh
  postinstall: ./scripts/postinstall.sh
  preremove: ./scripts/preremove.sh
  postremove: ./scripts/postremove.sh
