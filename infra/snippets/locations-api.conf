# grappa — shared nginx reverse-proxy locations (dumb proxy → BEAM)
#
# Single source of truth for the nginx→BEAM proxy surface, included from
# every nginx substrate that still exists:
#   - infra/linux/nginx.conf         (native systemd host)
#   - cicchetto/e2e/nginx-test.conf  (the e2e :80 + :443 TLS surface)
#   - infra/cloud/first-boot.sh      (fetches this file at boot and writes
#                                     a site that includes it)
# Two substrates dropped their nginx entirely and are NOT includers: the
# Docker `--profile prod` container went in #485, and the m42 bastille
# jail followed — both publish the BEAM directly, with nothing in front
# of it inside the box. (m42 still has a HOST nginx vhost, but that one
# is the operator's, out of this repo, and does not include this file.)
#
# #485 collapsed this to a DUMB reverse proxy. Everything nginx used to do
# now lives in the BEAM:
#   - the SPA + static assets + PWA manifest are self-served by Plug.Static
#     + the SPA history-fallback route (Grappa.Cic.Bundle);
#   - the security headers (CSP + siblings) are emitted by
#     GrappaWeb.Plugs.SecurityHeaders — the SOLE owner, so nginx MUST NOT
#     re-assert them: duplicate Content-Security-Policy headers are enforced
#     as the INTERSECTION of all policies, a prod-only footgun;
#   - /service-worker.js (no-cache) + /backgrounds/ (far-future immutable)
#     cache policy is emitted by the BEAM;
#   - the REST/admin route allowlist is GONE. It used to keep future routes
#     — and the loopback-only /admin/reload — from being auto-exposed through
#     nginx. That defense now rests on the BEAM gates (Plugs.LoopbackOnly
#     checks the REAL client IP via RemoteIpFromProxy, the :admin_authn
#     pipeline, and the port-publish posture) — the same posture the Docker
#     single-container path already had with no nginx in front at all.
#
# The includer declares `upstream grappa_upstream { ... }` plus the
# per-substrate `listen` / `server_name` / TLS bits. This file is
# substrate-agnostic: no `root`, no `listen`, no cert.
#
# #1030 — CONTRACT ON THAT UPSTREAM BLOCK. `location /` below sends an empty
# Connection header, so the includer's `keepalive` pool is live and two idle
# timers now sit on every proxied connection: the includer's
# `keepalive_timeout` (inside `upstream { }`, nginx default 60s) and the
# BEAM's `read_timeout` (75s, config/config.exs). The pool's CLIENT must give
# up FIRST — with the server closing at or before nginx, nginx dispatches onto
# a socket Bandit is closing in that instant and the request dies as a 502.
# So: pin `keepalive_timeout` inside the upstream block, strictly BELOW the
# BEAM's read_timeout. Every in-repo includer does. An includer that lives
# outside this repo — the m42 host vhost is one — is on the operator, and no
# test here can see it.

# Body ceilings — the same two the BEAM's router-level multipart parsers
# use (GrappaWeb.MultipartLimits, issue 2529): 128m here for every route,
# and the upload ceiling on the three upload doors only, nested inside
# `location /` below. The BEAM's per-file admin caps are the real policy;
# these only have to clear them. nginx cannot tell methods apart, so every
# method on those three paths gets the upload ceiling here, while the BEAM
# gives it only to POST /api/uploads, POST /api/uploads/encrypted and
# PUT /networks/:id/avatar.
# GrappaWeb.MultipartBodyTest holds both numbers to the BEAM's and both
# locations to the router's upload paths.
client_max_body_size 128m;

# Phoenix Channels WS endpoint. Upgrade/Connection + HTTP/1.1 are the
# WebSocket handshake; without them Phoenix never sees the upgrade and the
# channel stays HTTP-only (no realtime).
location /socket {
    proxy_pass http://grappa_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Long-lived WS — disable idle proxy timeouts (Phoenix's heartbeat
    # keeps it warm).
    proxy_read_timeout  86400s;
    proxy_send_timeout  86400s;
}

# Everything else — REST, /healthz, /uploads, the SPA shell + static
# assets, the PWA manifest, /service-worker.js, /backgrounds/ — is served
# by the BEAM. nginx just forwards; the BEAM owns routing, headers, caching.
location / {
    proxy_pass http://grappa_upstream;
    proxy_http_version 1.1;
    # Empty Connection header so the upstream `keepalive` pool warms up;
    # otherwise nginx forwards the client's Connection header verbatim and
    # every request opens a fresh TCP socket to Bandit.
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The three upload doors (POST /api/uploads, POST /api/uploads/encrypted,
    # PUT /networks/:id/avatar) take the upload ceiling; nothing else does.
    # Nested so they inherit every proxy_set_header and proxy_http_version
    # above (no proxy_set_header at this level, so nginx inherits them all);
    # proxy_pass is a handler and is never inherited, so each repeats it.
    location = /api/uploads {
        client_max_body_size 520m;
        proxy_pass http://grappa_upstream;
    }

    location = /api/uploads/encrypted {
        client_max_body_size 520m;
        proxy_pass http://grappa_upstream;
    }

    location ~ ^/networks/[^/]+/avatar$ {
        client_max_body_size 520m;
        proxy_pass http://grappa_upstream;
    }
}
