# grappa — nginx config for a native Linux (systemd) host (dumb proxy → BEAM).
#
# #485 collapsed this to a PURE reverse proxy. The BEAM self-serves the SPA + static + PWA manifest and OWNS
# every security header (GrappaWeb.Plugs.SecurityHeaders), so this host's
# nginx no longer serves files from disk — it just forwards to the BEAM on
# 127.0.0.1:4000.
#
# This host's nginx does NOT terminate TLS. A separate upstream machine
# reverse-proxies the operator's public http/https traffic and forwards here
# over plain HTTP — same shape as the m42 host→jail hop. nginx restricts by
# source IP only when TRUSTED_UPSTREAM_CIDR is set at install time (see
# install_nginx.sh); set it once the upstream box's address is known.
#
# Installed by install_nginx.sh, which:
#   1. cp this file → /etc/nginx/nginx.conf (substituting @LISTEN_ADDR@ and
#      the optional allow/deny block)
#   2. cp ../snippets/{locations-api,log-format}.conf → /etc/nginx/snippets/
#   3. nginx -t && systemctl enable --now nginx (or reload if already up)

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;

    # Access-log shape — shared with every other nginx substrate (#1029).
    # Must sit here in the http context: `log_format` is not valid inside
    # `server { }`, which is where locations-api.conf is included.
    include snippets/log-format.conf;

    upstream grappa_upstream {
        server 127.0.0.1:4000;
        keepalive 32;
    }

    server {
        listen @LISTEN_ADDR@ default_server;
        server_name _;

@TRUSTED_UPSTREAM_BLOCK@

        # Dumb reverse proxy — no `root`, no static serving. The BEAM
        # self-serves the SPA + owns all headers. Shared with every other
        # nginx substrate (single source of truth).
        include snippets/locations-api.conf;
    }
}
