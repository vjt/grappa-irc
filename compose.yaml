# grappa — one compose file for dev and prod. One image, `mix phx.server`
# in every environment; MIX_ENV is the only env-distinguishing variable.
#
#   dev:  docker compose up
#   prod: MIX_ENV=prod docker compose --profile prod up -d
#   ircd: docker compose --profile ircd up -d          (#1027 bridge, opt-in)
#
#   mix tasks: scripts/mix.sh test    shell: scripts/iex.sh
#   logs:      scripts/monitor.sh
#
# Personal bindings (LAN/VLAN address, PHX_HOST) go in the gitignored
# `compose.override.yaml`, auto-loaded by scripts/_lib.sh — see
# `compose.override.yaml.example`.
#
# Why this file is shaped the way it is — the bind mount, the publish
# default, the named-volume EACCES trap, CIC_BUILD_OUT — is in
# docs/OPERATIONS.md § "The Docker compose stack (compose.yaml)".

services:
  grappa:
    build:
      context: .
    image: grappa:latest
    pull_policy: never
    container_name: grappa
    hostname: grappa
    restart: unless-stopped
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    working_dir: /app
    # Loopback by default. Override to bind a LAN address, or leave it here
    # and front it with your own TLS proxy — infra/nginx-tls-frontend.example.conf.
    ports:
      - "${GRAPPA_PUBLISH:-127.0.0.1:4000}:4000"
    networks:
      - grappa_internal
    # `required: false` — the SPA build is prod-profile-gated, so a plain dev
    # `docker compose up` must still start grappa without it.
    depends_on:
      cicchetto-build:
        condition: service_completed_successfully
        required: false
    volumes:
      # Toolchain-only image: hex, deps/ and _build/ all live in this mounted
      # tree and are installed on first boot (#364 docker S1).
      - ./:/app
      # Per-env state: sqlite, logs, uploads, the served SPA dist.
      - ./runtime:/app/runtime
    environment:
      MIX_ENV: ${MIX_ENV:-dev}
      DATABASE_PATH: /app/runtime/grappa_${MIX_ENV:-dev}.db
      # Empty default: unset in dev, where config/dev.exs covers them. In prod
      # the host shell or .env must export real values or runtime.exs raises.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      SECRET_SIGNING_SALT: ${SECRET_SIGNING_SALT:-}
      GRAPPA_ENCRYPTION_KEY: ${GRAPPA_ENCRYPTION_KEY:-}
      PHX_HOST: ${PHX_HOST:-}
      EXTRA_CHECK_ORIGINS: ${EXTRA_CHECK_ORIGINS:-}
      GRAPPA_PASSKEY_ORIGIN: ${GRAPPA_PASSKEY_ORIGIN:-}
      # BEAM resource caps; bin/start.sh applies its own defaults when unset.
      GRAPPA_MAX_USERS: ${GRAPPA_MAX_USERS:-}
      GRAPPA_DIRTY_SCHEDULERS: ${GRAPPA_DIRTY_SCHEDULERS:-}
      # Outbound source-alias substrate. Docker cannot alias lo0 nor run
      # AnyIP, so it stays :docker — a no-op adapter (#543).
      GRAPPA_SUBSTRATE: ${GRAPPA_SUBSTRATE:-docker}
      # Admission captcha (T31). Export provider + secret + site key to enable.
      GRAPPA_CAPTCHA_PROVIDER: ${GRAPPA_CAPTCHA_PROVIDER:-disabled}
      GRAPPA_CAPTCHA_SITE_KEY: ${GRAPPA_CAPTCHA_SITE_KEY:-}
      GRAPPA_CAPTCHA_SECRET: ${GRAPPA_CAPTCHA_SECRET:-}
      # Web Push VAPID keypair; generate with `scripts/mix.sh grappa.gen_vapid`.
      # Bootstrap raises in prod when either key is missing.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Erlang distribution cookie for `bin/grappa remote-shell` (T-2). The dev
      # default keeps `docker compose up` clone-and-go; runtime.exs raises in
      # prod when it is unset or still the sentinel. Threat model: .env.example.
      RELEASE_COOKIE: ${RELEASE_COOKIE:-grappa-dev-cookie-do-not-use-in-prod}
      UPLOADS_STORAGE_ROOT: ${UPLOADS_STORAGE_ROOT:-/app/runtime/uploads}
      # The built SPA dist the BEAM self-serves (Plug.Static + history
      # fallback). Same dir the cicchetto-build service writes (#399).
      #
      # This default belongs to THIS stack, which builds the bundle here.
      # Do not point this file at the PUBLISHED release image: it bakes the
      # SPA at /app/cicchetto-dist and sets CIC_DIST_ROOT to match, but a
      # compose `environment:` key overrides an image ENV — so the line
      # below would redirect the root to a directory that image does not
      # have and 404 the frontend on a container that is otherwise healthy
      # (#1161). Use compose.release.yaml for it.
      #
      # The image is named by description and not by tag on purpose:
      # test/infra/release_compose_test.bats greps this file for the
      # registry path, and a mention in prose reads to a grep exactly like
      # a service that pulls it.
      CIC_DIST_ROOT: ${CIC_DIST_ROOT:-/app/runtime/cicchetto-dist}
      # Literal defaults, NOT the empty-default form used above: an empty
      # string reaches String.to_integer/1 and crashes at boot (#369 X1).
      POOL_SIZE: ${POOL_SIZE:-10}
      # PORT is NOT SUPPORTED on this substrate (#1409 D-S6): this line is
      # the only Docker-side consumer. The container side of the publish
      # above, the healthcheck below, the Dockerfile probe, and the deploy
      # POSTs all hardcode 4000, so an override makes the app listen
      # somewhere nothing looks. Move the port with GRAPPA_PUBLISH (host
      # side) instead. Honoured end to end only on the Docker-free
      # substrates.
      PORT: ${PORT:-4000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      # First boot on a fresh clone fetches deps and compiles from source, and
      # takes minutes; start_period keeps those failures from counting.
      start_period: 180s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Builds the cicchetto SPA into ./runtime/cicchetto-dist, which the BEAM
  # self-serves. The deploy wrappers run it explicitly before bringing grappa
  # up; grappa's depends_on is the safety net for a manual `--profile prod up`.
  cicchetto-build:
    profiles: [prod]
    # Digest-pinned (#103 supply-chain). Refresh on an intentional bump:
    #   docker buildx imagetools inspect oven/bun:1 --format '{{.Manifest.Digest}}'
    image: oven/bun:1@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    working_dir: /app
    volumes:
      - ./cicchetto:/app
      - ./runtime/bun-cache:/cache
      # Vite EMPTIES the out dir before it writes, and the default here is the
      # dir the BEAM serves per request. A live deploy must point this at a
      # staging sibling and rename it into place, or it serves an empty SPA
      # for the whole build (#1020) — docs/OPERATIONS.md § "The Docker compose
      # stack (compose.yaml)".
      - ${CIC_BUILD_OUT:-./runtime/cicchetto-dist}:/app/dist
    tmpfs:
      # uid/gid must track `user:` above: bun writes to HOME=/tmp, and a
      # mismatch fails every write with EACCES and hangs the deploy on
      # grappa's depends_on.
      - /tmp:exec,uid=${CONTAINER_UID:-1000},gid=${CONTAINER_GID:-1000}
    environment:
      HOME: /tmp
      BUN_INSTALL_CACHE_DIR: /cache
      # Vite bakes this into <meta cicchetto-version>, and this container
      # mounts only ./cicchetto, so the deploy wrappers export it from the
      # repo-root VERSION file (#538/#652). Empty makes vite fail loud.
      GRAPPA_VERSION: ${GRAPPA_VERSION:-}
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run build"]

  # The `shottino --ircd` bridge (#1027): a real IRC server on a port, so
  # irssi/weechat/hexchat/goguma can reach grappa without speaking its REST +
  # Channels protocol. Opt-in via its own profile.
  #
  # ONE SERVICE PER USER, not per network — a downstream client names the
  # network in `PASS <network>:<password>`, so one bridge fronts every network
  # that grappa account holds. A second account needs a second service on a
  # second port. Why it has its own image, and what the state mount is really
  # protecting: docs/OPERATIONS.md § "The shottino --ircd bridge as a compose
  # service (#1027)".
  shottino-ircd:
    profiles: [ircd]
    build:
      context: .
      dockerfile: Dockerfile.shottino
    image: grappa-shottino:latest
    pull_policy: never
    container_name: grappa-shottino-ircd
    restart: unless-stopped
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    networks:
      - grappa_internal
    # The bouncer must be answering before the bridge logs in, or the first
    # start fails its login and `restart: unless-stopped` turns the boot race
    # into a retry loop that reads like a bad password.
    depends_on:
      grappa:
        condition: service_healthy
    ports:
      # Loopback by default. Publishing this off-loopback makes shottino REFUSE
      # to start without SHOTTINO_IRCD_PASS; that refusal is deliberate and
      # this service does not work around it.
      - "${SHOTTINO_IRCD_PUBLISH:-127.0.0.1:6667}:6667"
    volumes:
      # The bridge's XDG data home. Headless, it writes every message of the
      # session to `runtime/shottino/shottino/ircd.log` in plain text, mode
      # 0600, never rotated — this mount is what keeps that transcript under
      # runtime/ instead of inside the container or the operator's checkout.
      - ./runtime/shottino:/state
    environment:
      # Both MANDATORY, neither defaulted: headless there is nobody to prompt
      # for the login password (and a command line would show it in `ps`), and
      # the bridge password is required once the port is off-loopback. They
      # belong in .env or the host shell, never here.
      SHOTTINO_PASSWORD: ${SHOTTINO_PASSWORD:-}
      SHOTTINO_IRCD_PASS: ${SHOTTINO_IRCD_PASS:-}
    # `--foreground` because compose reads the default fork-after-bind as a
    # crash. Unset SHOTTINO_USER is passed through empty and fails at LOGIN,
    # which under `restart: unless-stopped` reads as a restart loop — check
    # this variable first when the bridge will not stay up.
    command:
      - shottino
      - --ircd=0.0.0.0:6667
      - --foreground
      - ${SHOTTINO_GRAPPA_URL:-http://grappa:4000}
      - ${SHOTTINO_USER:-}
    # busybox nc, already in the base image — no package added for a probe.
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6667 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  grappa_internal:
    driver: bridge
