name: release

# Tag-driven release CI — self-hosting Part 2 / #419 R3.
#
# Fires on a `vX.Y.Z` tag push. Builds the distro packages from that tag,
# PROVES each one on the built artifact (the migrate path + the reported
# version), and publishes them as GitHub Release assets. This is the
# authoritative gate for the packaging work: R1/R2 proved the model by
# hand in containers; R3 runs that proof in CI on every tag.
#
#   * deb    — nfpm binary package (amd64), built by infra/packaging/build.sh
#              on a glibc setup-beam runner (Elixir 1.19 / OTP 28), then
#              INSTALLED (apt) so postinstall's openssl secrets + packaged
#              migrate run for real.
#   * arch   — source package built by `makepkg` on a real x86_64 Arch
#              container (Elixir 1.20 / OTP 29 — the toolchain delta R2
#              could only prove on a like-for-like image, never a full
#              makepkg → pacman -U). Regenerates .SRCINFO + updpkgsums.
#   * rpm    — nfpm binary package (x86_64), built by infra/packaging/build.sh
#              inside a PINNED Fedora container using Fedora's OWN Elixir/OTP
#              (never setup-beam — its Ubuntu-built ERTS would reproduce the
#              exact glibc mismatch this job exists to avoid), then INSTALLED
#              (dnf) so %post's openssl secrets + packaged migrate run for
#              real. The Fedora-built ERTS is why the .rpm cannot be a flag on
#              the deb job — see #438 + the packaging README.
#   * docker — TWO images, each multi-arch (linux/amd64 + linux/arm64 via
#              buildx + QEMU) and each PUSHED as :<tag> + :latest with OCI
#              source/version/revision labels: the self-contained RELEASE
#              image (Dockerfile.release) to ghcr.io/<owner>/grappa (#503
#              unit C / scope 5), then the `shottino --ircd` BRIDGE image
#              (Dockerfile.shottino) to ghcr.io/<owner>/grappa-shottino
#              (#1168), so the bridge can be PULLED instead of compiled by
#              every operator who switches it on. It is a standalone leg — it
#              publishes to the container registry itself, NOT a GitHub
#              Release asset, so it is NOT in `publish`'s needs and runs in
#              parallel with the package jobs.
#   * smoke  — DEPLOYS the image the docker job just produced and probes it
#              (#1162). Every other gate in this repo tests the deploy SCRIPTS
#              with `docker` stubbed; this one boots the artifact and asks it
#              questions over HTTP. On a tag it pulls the PUBLISHED
#              ghcr.io/<owner>/grappa:v<version> — the thing operators run; on
#              a docker_validation dry-run it re-exports the amd64 image from
#              the build cache, so the pre-tag smoke finally smokes something.
#              amd64 only: the arm64 leg is proven by the build.
#   * publish — attaches deb + rpm + pkg.tar.zst + the regenerated
#              PKGBUILD/.SRCINFO to the GitHub Release. Runs even if a package
#              job FAILED and attaches ONLY what built (#504): a broken distro
#              never withholds the artifacts that succeeded; the failed leg
#              stays red on its own.
#
# Version proof (#419 R3 / #391): the packaged build must report the BARE
# `X.Y.Z`, never `-dev`. Two paths, both asserted on the real artifact:
#   * the .deb builds in the CI checkout (has .git on the clean tag) → the
#     #391 clean-tag path yields the bare version;
#   * the Arch package builds from the GitHub source TARBALL (no .git by
#     construction) → Grappa.Version's nil-git-facts path yields the bare
#     version — the compiled VERSION-file constant (#652), which the tarball
#     always carries. See lib/grappa/version.ex + DESIGN_NOTES.
#
# BUILD ≠ PUBLISH TO AUR. This workflow publishes GitHub Release assets and
# regenerates the AUR recipe metadata; pushing to aur.archlinux.org stays a
# HUMAN step (no AUR credentials in the tree). See infra/packaging/aur/README.md.
#
# The .rpm ships from the `rpm` job. It needs a Fedora-built ERTS (glibc +
# libssl are distro-specific, so a Debian release is not a valid RHEL
# payload). It is built on the OLDEST Fedora that carries Elixir 1.19 —
# glibc is backward-compatible, so building against the oldest floor gives
# the widest validity — and is declared FEDORA-FAMILY ONLY: RHEL/Rocky/Alma
# (older glibc) are out of scope (#438). See DESIGN_NOTES R1/R2 + the
# packaging README.
#
# This workflow runs on a `v*` tag push (the real release — every job PUBLISHES)
# OR via manual workflow_dispatch, which has TWO mutually-exclusive modes:
#
#   * REPAIR (default, `docker_validation=false`, #504): (re)build an EXISTING
#     tag's deb/arch/rpm AND its ghcr images and upload to its release, no tag
#     surgery — dispatch from main with the `tag` input (e.g. `v0.6.0`). Every
#     job resolves the tag into `RELEASE_TAG`/`REPAIR_TAG` and checks it out
#     explicitly. Image repair used to be out of scope ("re-tag to rebuild it");
#     it is now IN scope, because a release whose packages ship and whose image
#     does not leaves `:latest` pointing at the PREVIOUS version — an operator
#     pulling the announced release silently gets the old one (v1.0.0, 13/8).
#     The image is built from the TAG's tree, but the build SCAFFOLDING
#     (`Dockerfile.release`, `Dockerfile.shottino`, `.dockerignore`,
#     `infra/docker`) is taken from the DISPATCHED ref — that is the whole point:
#     the scaffolding is what was broken. The tree is therefore MIXED, which is
#     why the version gate demands that the `tag` input match that tree's
#     `VERSION` (a repair republishes a tag's own images, it never re-versions
#     them) and why the pushed images carry
#     `chat.grappa.image.scaffolding-revision` recording where the recipe came
#     from. smoke pulls what was PUBLISHED, exactly as on a tag push.
#   * DOCKER DRY-RUN (`docker_validation=true`): a ZERO-PUBLICATION validation of
#     the release-image job ITSELF (not a copy of it — the same job that ships).
#     Only the docker job runs; it builds `Dockerfile.release` multi-arch from
#     the DISPATCHED ref (a branch, so it works BEFORE merge, when only the
#     branch carries the file) with `push:false` and no registry login — it
#     proves the build (arm64 QEMU + ABI-lockstep assertion + cic + mix release)
#     and publishes NOTHING. deb/arch/rpm/publish are skipped. Run it with:
#       gh workflow run release.yml --ref <branch> -f docker_validation=true
#
# The tag-push path is unchanged by the dry-run plumbing: the default publishes.
# A normal main-branch push never triggers this workflow (ci.yml + integration.yml
# handle those); its concurrency group is separate from ci.yml, so it never
# cancels a CI run.

on:
  push:
    tags:
      - "v*"
  # Repair / re-run path (#504 defect 2 follow-through): (re)build an EXISTING
  # tag and attach its assets to the existing release, no tag surgery. A plain
  # `gh run rerun` would replay the workflow FROM THE TAG's commit (the buggy
  # version); dispatching from main runs the FIXED workflow against the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Repair path only: existing release tag to (re)build deb/arch/rpm + ghcr images for, and attach assets to (e.g. v0.6.0). Images build from the tag's tree with the DISPATCHED ref's Dockerfiles. Ignored when docker_validation is true."
        required: false
        type: string
      docker_validation:
        description: "Zero-publication validation of the release-image job: build Dockerfile.release multi-arch from the DISPATCHED ref (branch), push:false, NOTHING published. Skips deb/arch/rpm/publish."
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deb:
    name: build + prove .deb (amd64)
    # Runs on a tag push and on a repair dispatch (unchanged). Skipped ONLY on a
    # docker-image dry-run dispatch (docker_validation=true), which validates the
    # release-image job alone and must publish nothing.
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.docker_validation) }}
    runs-on: ubuntu-latest
    env:
      # The release tag, resolved from whichever trigger fired: the input on a
      # manual repair dispatch, else the pushed tag. Every tag reference in this
      # job uses it (never bare GITHUB_REF_NAME, which is `main` on a dispatch).
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout (tags for #391 version derivation)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # Check out the RELEASE TAG explicitly so a workflow_dispatch repair
          # builds the TAGGED tree, not main (on a tag push this equals the
          # default ref). fetch-depth 0 pulls tags so `git describe --tags
          # --exact-match` resolves the release tag at build time — the .deb's
          # Grappa.Version then reports the bare X.Y.Z via the #391 clean-tag path.
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify the tag matches the VERSION file
        id: ver
        run: |
          tag="${RELEASE_TAG#v}"
          srcv="$(infra/packaging/version.sh)"
          echo "tag=$tag VERSION=$srcv"
          if [ "$tag" != "$srcv" ]; then
            echo "::error::tag v$tag does not match the VERSION file ($srcv) — bump VERSION before cutting the tag"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Setup BEAM (from .tool-versions)
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          # #1408 D-S10 — the pin lives in .tool-versions and nowhere else.
          # `version-type: strict` is mandatory with version-file, not a
          # style choice: setup-beam throws before reading the file without
          # it. The asdf spellings resolve as-is — `1.19.5-otp-28` has its
          # `-otp-N` suffix stripped for the lookup and reused as the OTP
          # constraint, and `28.5` matches the builds listing's `OTP-28.5`.
          version-file: .tool-versions
          version-type: strict

      - name: Setup bun (cicchetto build)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # pkg-config + the ncursesw/openssl headers are shottino's BUILD
      # deps: build.sh compiles the terminal client into the staging tree
      # and ./configure hard-fails without them. Omitting them would break
      # the .deb build at packaging time — on a tag, which is the worst
      # possible place to discover it.
      - name: Install media tools + sqlite + shottino build deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libimage-exiftool-perl ffmpeg sqlite3 \
            pkg-config libncurses-dev libssl-dev

      - name: Build the .deb
        run: infra/packaging/build.sh

      # BOTH packages, one transaction — which is itself the proof that #1447
      # landed whole: while the bouncer still owned /usr/bin/shottino this
      # command could not have succeeded (dpkg refuses two owners of one
      # path). The Recommends: cannot be exercised here — the client is not in
      # any apt repo — so the pair is named explicitly.
      - name: Install both packages (postinstall runs openssl secrets + migrate)
        run: sudo apt-get install -y ./dist/grappa_*.deb ./dist-shottino/shottino_*.deb

      - name: Prove the packaged migrate applied every migration
        run: |
          expected="$(find priv/repo/migrations -name '*.exs' | wc -l | tr -d ' ')"
          applied="$(sudo sqlite3 /var/lib/grappa/grappa.db 'SELECT count(*) FROM schema_migrations')"
          echo "migrations: expected=$expected applied=$applied"
          if [ "$applied" != "$expected" ]; then
            echo "::error::migration count mismatch — expected $expected, applied $applied"
            exit 1
          fi

      - name: Prove the artifact reports the bare tag version
        run: |
          want="${{ steps.ver.outputs.version }}"
          # Sentinel-prefix the printed version so a stray stdout line from the
          # release boot can never be mistaken for it.
          got="$(sudo grappa eval 'Application.load(:grappa); IO.puts("grappa-vsn=" <> Grappa.Version.current())' | grep '^grappa-vsn=' | tail -n1 | cut -d= -f2 | tr -d '\r')"
          echo "reported version: '$got' (want '$want')"
          if [ "$got" != "$want" ]; then
            echo "::error::packaged .deb reports '$got', expected bare '$want'"
            exit 1
          fi

      # A DIFFERENT claim from the step above, and #1594's whole point. That
      # one reads the number the BEAM reports; this one reads the number the
      # PACKAGE is stamped with, which nfpm derives and can therefore restamp.
      # It did: `1.3.0-rc1` reached apt as `1.3.0~rc1`, and no assertion in
      # this pipeline was looking at that field — the two version proofs it
      # had both compared the CLIENT package against the CLIENT's carrier.
      # `pkgversion.sh` is the shared oracle; its map is measured against the
      # pinned nfpm, not read off nfpm's source.
      - name: Prove the bouncer .deb is stamped with the version nfpm derives from VERSION
        run: |
          deb="$(find dist -name 'grappa_*.deb' -print -quit)"
          [ -n "$deb" ] || { echo "::error::no bouncer .deb in dist/"; exit 1; }
          want="$(infra/packaging/pkgversion.sh deb grappa)"
          got="$(dpkg-deb -f "$deb" Version)"
          echo "bouncer package version: '$got' (want '$want')"
          [ "$got" = "$want" ] || {
            echo "::error::the bouncer .deb is stamped '$got', expected '$want'"; exit 1; }

      # Same proof discipline as the migrate + version checks above: assert
      # on the INSTALLED artifact, not on the build tree. `--help` exits 0
      # without a server, a terminal or config, so it exercises the real
      # dynamic links (libncursesw, libssl) that the package `depends` on.
      #
      # Both directions, because #1447 is a MOVE: the file must be gone from
      # the bouncer package AND present on the host from the client one. The
      # first half is asserted on the artifact rather than on the filesystem —
      # the filesystem has it either way, which is exactly how a failed move
      # would look green.
      - name: Prove the client moved packages — out of the bouncer, into its own
        run: |
          deb="$(find dist -name 'grappa_*.deb' -print -quit)"
          if dpkg-deb -c "$deb" | grep -q ' ./usr/bin/shottino$'; then
            echo "::error::the bouncer .deb still ships /usr/bin/shottino"
            dpkg-deb -c "$deb" | grep shottino; exit 1
          fi
          test -x /usr/bin/shottino || { echo "::error::/usr/bin/shottino missing after installing both packages"; exit 1; }
          dpkg -S /usr/bin/shottino | grep -q '^shottino:' || {
            echo "::error::/usr/bin/shottino is not owned by the shottino package"
            dpkg -S /usr/bin/shottino; exit 1; }
          /usr/bin/shottino --help > /tmp/shottino-help.txt
          grep -q '^usage: ' /tmp/shottino-help.txt || {
            echo "::error::shottino --help produced no usage output"; cat /tmp/shottino-help.txt; exit 1; }
          echo "shottino OK: $(/usr/bin/shottino --help | head -1)"

      # #1447 — the STANDALONE client package, now installed alongside the
      # bouncer by the step above. This one still reads the ARTIFACT's
      # metadata: the bats suite pins the CONFIG, and only here can nfpm's
      # rendering of it be proven.
      - name: Prove the standalone shottino package is thin and takes the path over
        run: |
          deb="$(find dist-shottino -name 'shottino_*.deb' -print -quit)"
          [ -n "$deb" ] || { echo "::error::no standalone shottino .deb in dist-shottino/"; exit 1; }
          echo "package: $deb"
          dpkg-deb -I "$deb"

          # Exactly one regular file, and it is the client. A package that
          # grew a second payload has stopped being the thin client package.
          files="$(dpkg-deb -c "$deb" | awk '$1 !~ /^d/ { print $NF }')"
          echo "contents: $files"
          [ "$files" = "./usr/bin/shottino" ] || {
            echo "::error::expected exactly ./usr/bin/shottino, got: $files"; exit 1; }

          # The takeover metadata reached the control file intact — an
          # unexpanded ${VAR} would show up here verbatim (nfpm does not
          # expand deb.breaks). The trailing `~` is #1594's pre-release
          # epsilon and is part of the boundary VALUE: without it the relation
          # captures grappa's own `1.3.0~rc1` and the pair stops installing.
          dpkg-deb -f "$deb" Breaks | grep -qF 'grappa (<< 1.3.0~)' || {
            echo "::error::Breaks: is not the literal grappa (<< 1.3.0~)"
            dpkg-deb -f "$deb" Breaks; exit 1; }
          dpkg-deb -f "$deb" Replaces | grep -qF 'grappa (<< 1.3.0~)' || {
            echo "::error::Replaces: is not the literal grappa (<< 1.3.0~)"
            dpkg-deb -f "$deb" Replaces; exit 1; }

          # Its own version line, not the bouncer's — through the same nfpm
          # map the bouncer's proof uses, so a pre-release on the client's
          # cadence is covered the day it appears rather than the day it fails.
          want="$(infra/packaging/pkgversion.sh deb shottino)"
          got="$(dpkg-deb -f "$deb" Version)"
          echo "client version: '$got' (want '$want')"
          [ "$got" = "$want" ] || {
            echo "::error::client package is stamped '$got', expected '$want'"; exit 1; }

      # Two packages, two upload steps (#1447 slice B). One glob over a shared
      # directory would publish whatever landed there next; a step per artifact
      # keeps publication something a human wrote down. `publish` then attaches
      # by NAME (infra/packaging/release_assets.sh), and its expected-kind
      # table requires BOTH — a client package that failed to build fails the
      # release loudly instead of vanishing from it.
      - name: Upload .deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grappa-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Upload the client .deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shottino-deb
          path: dist-shottino/*.deb
          if-no-files-found: error

  arch:
    name: build + prove Arch pkg (x86_64)
    # See the deb job: skipped only on a docker-image dry-run dispatch.
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.docker_validation) }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      # Release tag from either trigger (see the deb job). The Arch build derives
      # its version from the GitHub source TARBALL via updpkgsums, so this drives
      # the checkout + the version asserts, not a .git describe.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Install the Arch build toolchain
        run: |
          # -Syu (not -Sy): a partial upgrade against a half-synced db can
          # pull incompatible versions on Arch. --needed skips already-present.
          # pacman-contrib provides `updpkgsums` (used by the makepkg step
          # below); base-devel does NOT include it, so its absence killed the
          # first release run at exit 127 (#504 defect 1).
          pacman -Syu --noconfirm --needed \
            base-devel git elixir bun namcap sqlite sudo pacman-contrib

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # Check out the release tag so a repair dispatch builds the tagged
          # PKGBUILD/recipe, not main's.
          ref: ${{ env.RELEASE_TAG }}

      # Guard, never fixer (#538/#652): the ONE hand-declared version is the
      # repo-root VERSION file, and it must match the tag being cut. pkgver is
      # DERIVED from VERSION by regen.sh below, so it is not an independent
      # carrier to verify — asserting tag==pkgver here would be tautological
      # once CI fills it. (Deriving pkgver from VERSION is "derive from the
      # origin"; the rejected alternative was deriving it from the TAG, which
      # makes THIS gate compare a value against itself.)
      - name: Verify the tag matches the VERSION file
        run: |
          tag="${RELEASE_TAG#v}"
          srcv="$(infra/packaging/version.sh)"
          echo "tag=$tag VERSION=$srcv"
          if [ "$tag" != "$srcv" ]; then
            echo "::error::tag v$tag does not match the VERSION file ($srcv) — bump VERSION before cutting the tag"
            exit 1
          fi

      - name: Create an unprivileged build user (makepkg refuses root)
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chown -R builder:builder .

      - name: regen.sh (derive both pkgvers) + makepkg — build both packages
        run: |
          cd infra/packaging/aur
          # regen.sh (#538/#652) fills the committed sentinels from their own
          # carriers — the repo-root VERSION for the bouncer, and since #1447
          # frontends/shottino/version.h for the client — then runs updpkgsums
          # (fetches the now-existing tag tarball, rewrites sha256sums=('SKIP'))
          # and regenerates each .SRCINFO. It is the SAME derivation path a
          # human uses to publish to the AUR — scripted, so a version can never
          # be a forgotten manual step. ONE regen.sh run covers both recipes.
          # makepkg then builds the mix release + cicchetto FROM THE TARBALL
          # (no .git → Grappa.Version reports the bare version). No
          # --warnings-as-errors: Elixir 1.20 warns from deps (see PKGBUILD).
          # -s: makepkg installs any missing depends/makedepends via pacman
          # (the builder has NOPASSWD sudo) rather than aborting the hard dep
          # check — so a future `depends` entry not transitively present still
          # builds. -f overwrites an existing package file.
          #
          # TWO makepkg runs, because #1447 made these two pkgbases rather than
          # one split: PKGBUILD(5) does not let a package_*() override pkgver,
          # and the client keeps its own version line.
          sudo -u builder bash -euo pipefail -c '
            ./regen.sh
            makepkg -sf --noconfirm
            cd shottino && makepkg -sf --noconfirm
          '

      - name: namcap the built packages (advisory)
        run: |
          cd infra/packaging/aur
          sudo -u builder namcap ./*.pkg.tar.zst ./shottino/*.pkg.tar.zst || true

      - name: Install both packages (grappa.install runs secrets + migrate)
        run: |
          cd infra/packaging/aur
          # One transaction, both packages — the Arch-side proof that the pair
          # is co-installable now that only the client's recipe owns
          # /usr/bin/shottino. pacman aborts on a file conflict, so this step
          # could not have passed before #1447 slice B.
          pacman -U --noconfirm ./*.pkg.tar.zst ./shottino/*.pkg.tar.zst

      - name: Prove the packaged migrate applied every migration
        run: |
          expected="$(find priv/repo/migrations -name '*.exs' | wc -l | tr -d ' ')"
          applied="$(sqlite3 /var/lib/grappa/grappa.db 'SELECT count(*) FROM schema_migrations')"
          echo "migrations: expected=$expected applied=$applied"
          if [ "$applied" != "$expected" ]; then
            echo "::error::migration count mismatch — expected $expected, applied $applied"
            exit 1
          fi

      - name: Prove the artifact reports the bare tag version (tarball → no .git → bare)
        run: |
          want="${RELEASE_TAG#v}"
          # Sentinel-prefix the printed version so a stray stdout line from the
          # release boot can never be mistaken for it.
          got="$(grappa eval 'Application.load(:grappa); IO.puts("grappa-vsn=" <> Grappa.Version.current())' | grep '^grappa-vsn=' | tail -n1 | cut -d= -f2 | tr -d '\r')"
          echo "reported version: '$got' (want '$want')"
          if [ "$got" != "$want" ]; then
            echo "::error::packaged Arch build reports '$got', expected bare '$want'"
            exit 1
          fi

      # Mirror of the .deb proof, both directions — the Arch packages are a
      # SOURCE build, so this additionally confirms shottino compiled on the
      # Arch toolchain (a newer gcc than the Debian one) and links that host's
      # libs. `pacman -Qo` is the ownership question: which package put the
      # file there. Asking the filesystem alone would pass either way, and
      # "either way" is precisely the failure #1447 slice B could ship.
      - name: Prove the client moved recipes — out of the bouncer, into its own
        run: |
          cd infra/packaging/aur
          if bsdtar -tf ./*.pkg.tar.zst | grep -qx 'usr/bin/shottino'; then
            echo "::error::the bouncer Arch package still ships usr/bin/shottino"; exit 1
          fi
          cd - >/dev/null
          test -x /usr/bin/shottino || { echo "::error::/usr/bin/shottino missing after installing both packages"; exit 1; }
          pacman -Qo /usr/bin/shottino | grep -q 'shottino ' || {
            echo "::error::/usr/bin/shottino is not owned by the shottino package"
            pacman -Qo /usr/bin/shottino; exit 1; }
          /usr/bin/shottino --help | grep -q '^usage: ' || {
            echo "::error::shottino --help produced no usage output"; exit 1; }
          echo "shottino OK: $(/usr/bin/shottino --help | head -1)"

      # Its own version line, read off the INSTALLED package (#1447). This is
      # the assertion a split PKGBUILD could not have satisfied: pkgver is
      # global to a pkgbase, so a split would report the bouncer's number here.
      - name: Prove the Arch client package carries the client's own version
        run: |
          want="$(infra/packaging/version.sh shottino)"
          got="$(pacman -Q shottino | awk '{print $2}' | cut -d- -f1)"
          echo "client package version: '$got' (want '$want')"
          [ "$got" = "$want" ] || {
            echo "::error::the Arch client package is stamped '$got', expected '$want'"; exit 1; }

      # The BOUNCER's own number, which nothing in this workflow used to check
      # (#1591). Both existing package-version gates — the deb job's and the
      # rpm job's — compare against the SHOTTINO carrier, so a restamped
      # grappa version would be seen by nobody. That was an omission while
      # pkgver was a verbatim copy of VERSION; since #1591 the Arch number is
      # deliberately TRANSFORMED (makepkg refuses the hyphen a semver
      # pre-release spells its suffix with), and an unchecked transformation
      # is the difference between a derivation and a hope.
      #
      # `cut -d- -f1` splits off pkgrel and is safe by construction: pkgver.sh
      # guarantees the value it returns holds no hyphen — that is its job.
      - name: Prove the derived pkgver reached the built bouncer package
        run: |
          want="$(infra/packaging/aur/pkgver.sh "$(infra/packaging/version.sh)")"
          got="$(pacman -Q grappa | awk '{print $2}' | cut -d- -f1)"
          echo "bouncer package version: '$got' (want '$want')"
          [ "$got" = "$want" ] || {
            echo "::error::the Arch bouncer package is stamped '$got', expected '$want'"; exit 1; }

      # The ordering claim the mapping's SPELLING rests on, re-measured with
      # the real comparator on a real Arch box. `1.3.0-rc1` maps to
      # `1.3.0rc1`, which sorts BELOW `1.3.0`; the Arch-conventional
      # `1.3.0_rc1` sorts ABOVE it and would strand every user who installed
      # the rc, since pacman would never offer them the release. pkgver.sh
      # encodes that as a shape rule (its bats suite runs on a host with no
      # pacman); this is the rule's source of truth, asserted at the only
      # moment a pre-release can reach a user.
      #
      # A no-op on a bare release, and it says so out loud rather than
      # reporting a green it never computed.
      - name: Prove a pre-release pkgver sorts BELOW its own release
        run: |
          srcv="$(infra/packaging/version.sh)"
          core="${srcv%%-*}"
          if [ "$core" = "$srcv" ]; then
            echo "VERSION is $srcv — no pre-release suffix, nothing to order"
            exit 0
          fi
          pkgver="$(infra/packaging/aur/pkgver.sh "$srcv")"
          cmp="$(vercmp "$pkgver" "$core")"
          echo "vercmp $pkgver $core = $cmp (want a negative number)"
          [ "$cmp" -lt 0 ] || {
            echo "::error::pkgver '$pkgver' does not sort below '$core' — pacman would never offer the $core upgrade"
            exit 1; }

      - name: Stage Arch artifacts (packages + regenerated recipe metadata)
        run: |
          mkdir -p arch-out
          cp infra/packaging/aur/*.pkg.tar.zst arch-out/
          cp infra/packaging/aur/shottino/*.pkg.tar.zst arch-out/
          # The regenerated recipe metadata a human copies into the AUR repo.
          # The client's copies are RENAMED, and not for tidiness: a release
          # asset is keyed by BASENAME, and the publish job's fallback uploads
          # with --clobber — two files called PKGBUILD would leave the release
          # holding one of them, silently, with no way to tell which. The
          # expected-kinds table names these two just like the others, so a
          # rename that drifts is a loud missing kind rather than a quiet
          # substitution. See aur/README.md for the publish-side rename back.
          cp infra/packaging/aur/PKGBUILD infra/packaging/aur/.SRCINFO arch-out/
          cp infra/packaging/aur/shottino/PKGBUILD arch-out/shottino.PKGBUILD
          cp infra/packaging/aur/shottino/.SRCINFO arch-out/shottino.SRCINFO

      - name: Upload Arch artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grappa-arch
          path: arch-out/*
          # `.SRCINFO` is a dotfile; upload-artifact excludes hidden files by
          # default, which would drop the recipe metadata the AUR push needs.
          include-hidden-files: true
          if-no-files-found: error

  rpm:
    name: build + prove .rpm (x86_64)
    # See the deb job: skipped only on a docker-image dry-run dispatch.
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.docker_validation) }}
    runs-on: ubuntu-latest
    # Pinned Fedora MAJOR (not :latest): a release artifact's glibc floor must
    # not move under us (#438 open-q2). The rule: the OLDEST still-supported
    # Fedora that carries Elixir 1.19 — glibc is backward-compatible, so
    # building against the oldest floor maximises the range of hosts the .rpm
    # runs on. Fedora 43 ships Elixir 1.19.5 (== our .tool-versions pin) on
    # Erlang/OTP 26; grappa runs on OTP 26 (hot_reload.ex documents 26+; #89's
    # :public_key.cacerts_get/0 is OTP 25+). Bump this when 43 goes EOL.
    container: fedora:43
    env:
      # Release tag from either trigger (see the deb job). The .rpm builds IN
      # the CI checkout (has .git on the clean tag), so — like the .deb, unlike
      # the tarball-built arch pkg — it reports the bare X.Y.Z via #391's
      # clean-tag path.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Install the Fedora build + proof toolchain
        run: |
          # Fedora's OWN Elixir + full Erlang/OTP — deliberately NOT setup-beam.
          # The point of a per-distro job is that the bundled ERTS links THIS
          # distro's glibc/libssl; setup-beam's Ubuntu-built OTP would bundle
          # the wrong libc and reproduce the exact bug that deferred the .rpm.
          #
          # `erlang` is Fedora's full-OTP metapackage. `mix release` assembles
          # grappa's whole transitive OTP app tree (public_key/ssl/inets/
          # runtime_tools) at BUILD time, and — exactly like Arch (#527) —
          # Fedora SPLITS OTP into per-app subpackages, so leaning on `elixir`'s
          # dep chain alone can miss them → "(Mix.Error) the application ...
          # could not be found". Pull the meta; do NOT enumerate subpackages
          # (fragile, drifts as deps add OTP apps).
          #
          # git BEFORE checkout: actions/checkout needs it for a real clone
          # (with .git), which #391's clean-tag version derivation reads;
          # without git it falls back to a .git-less tarball and the version
          # proof fails. gcc/make + *-devel + pkgconf: shottino's ./configure
          # and the exqlite NIF compile. tar/gzip/unzip: build.sh's pinned-nfpm
          # download + setup-bun. sqlite/openssl/util-linux: the %post
          # (gen-secrets openssl, runuser drop) + the migrate-count proof.
          # curl is deliberately NOT listed: build.sh downloads nfpm with it,
          # but `dnf install curl` would swap the base image's curl-minimal
          # (which already provides `curl -fsSL` and is guaranteed in the
          # pinned fedora:43 base) — so we rely on that pinned base binary.
          # install_weak_deps=False keeps optional recommends off the CI box.
          dnf install -y --setopt=install_weak_deps=False \
            elixir erlang \
            git gcc make pkgconf-pkg-config ncurses-devel openssl-devel \
            tar gzip unzip findutils sqlite openssl util-linux

      - name: Setup bun (cicchetto build)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Checkout (tags for #391 version derivation)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # Check out the RELEASE TAG explicitly (a dispatch repair builds the
          # tagged tree, not main); fetch-depth 0 pulls tags so `git describe
          # --tags --exact-match` resolves the release tag and Grappa.Version
          # reports the bare X.Y.Z via the #391 clean-tag path.
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Trust the checkout for the env-stripped version probe (#573)
        # The .rpm is the ONLY leg that compiles from the .git checkout INSIDE a
        # container: the host runner creates $GITHUB_WORKSPACE as its own uid
        # while these steps run as root, so git trips "detected dubious
        # ownership" and refuses to operate on it. actions/checkout forgives
        # that by writing a safe.directory into ~/.gitconfig — but
        # Grappa.Version.GitProbe shells out env-STRIPPED (System.cmd(_, _,
        # env: []) so SECRET_KEY_BASE/CLOAK_KEY never reach the subprocess),
        # which drops HOME, and with no HOME git never reads ~/.gitconfig. Every
        # describe/rev-parse then fails, the git facts fold to nil,
        # Grappa.Version reports -dev, and the #542 build-sha guard correctly
        # refuses to assemble it → the .rpm never builds (v0.8.0 + v0.9.0 both
        # shipped without one). /etc/gitconfig (SYSTEM config) IS read with no
        # HOME (nothing sets GIT_CONFIG_NOSYSTEM), so writing the trust there —
        # for $GITHUB_WORKSPACE, which equals GitProbe's @repo_root exactly —
        # lets the env-stripped probe see the tag. Leaves the deliberate
        # env-strip AND the #542 guard untouched; the deb job (no container, no
        # uid mismatch) and the arch job (builds from the .git-less tarball) are
        # both immune, so only this leg needs it.
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify the tag matches the VERSION file
        run: |
          tag="${RELEASE_TAG#v}"
          srcv="$(infra/packaging/version.sh)"
          echo "tag=$tag VERSION=$srcv"
          if [ "$tag" != "$srcv" ]; then
            echo "::error::tag v$tag does not match the VERSION file ($srcv) — bump VERSION before cutting the tag"
            exit 1
          fi

      - name: Build the .rpm (Fedora ERTS via GRAPPA_PKG_FORMAT=rpm)
        run: GRAPPA_PKG_FORMAT=rpm infra/packaging/build.sh

      # BOTH packages in one transaction — the rpm-side proof that the pair is
      # co-installable now that only one of them owns /usr/bin/shottino.
      # install_weak_deps stays FALSE (this asserts the hard dependency set, as
      # it always has); the client is named explicitly rather than arriving as
      # the Recommends:, which no repo here could satisfy anyway.
      - name: Install both packages (%post runs openssl secrets + migrate)
        run: dnf install -y --setopt=install_weak_deps=False ./dist/*.rpm ./dist-shottino/*.rpm

      - name: Prove the packaged migrate applied every migration
        run: |
          expected="$(find priv/repo/migrations -name '*.exs' | wc -l | tr -d ' ')"
          applied="$(sqlite3 /var/lib/grappa/grappa.db 'SELECT count(*) FROM schema_migrations')"
          echo "migrations: expected=$expected applied=$applied"
          if [ "$applied" != "$expected" ]; then
            echo "::error::migration count mismatch — expected $expected, applied $applied"
            exit 1
          fi

      - name: Prove the artifact reports the bare tag version
        run: |
          want="${RELEASE_TAG#v}"
          # Sentinel-prefix the printed version so a stray stdout line from the
          # release boot can never be mistaken for it.
          got="$(grappa eval 'Application.load(:grappa); IO.puts("grappa-vsn=" <> Grappa.Version.current())' | grep '^grappa-vsn=' | tail -n1 | cut -d= -f2 | tr -d '\r')"
          echo "reported version: '$got' (want '$want')"
          if [ "$got" != "$want" ]; then
            echo "::error::packaged .rpm reports '$got', expected bare '$want'"
            exit 1
          fi

      # The rpm twin of the deb job's stamped-version gate (#1594). Two fields
      # here, not one: nfpm could in principle split a pre-release out into
      # `Release`, and measured against the pinned 2.43.0 it does NOT — every
      # shape lands wholly in `Version` with `Release` left at the default 1.
      # Asserting both is what makes "the number was not restamped" a closed
      # claim rather than a claim about one field.
      - name: Prove the bouncer .rpm is stamped with the version nfpm derives from VERSION
        run: |
          pkg="$(find dist -name 'grappa-*.rpm' -print -quit)"
          [ -n "$pkg" ] || { echo "::error::no bouncer .rpm in dist/"; exit 1; }
          want="$(infra/packaging/pkgversion.sh rpm grappa)"
          got="$(rpm -qp --queryformat '%{VERSION}' "$pkg")"
          rel="$(rpm -qp --queryformat '%{RELEASE}' "$pkg")"
          echo "bouncer package NEVRA: $(rpm -qp --queryformat '%{NEVRA}' "$pkg")"
          echo "bouncer package version: '$got' (want '$want'), release: '$rel'"
          [ "$got" = "$want" ] || {
            echo "::error::the bouncer .rpm is stamped '$got', expected '$want'"; exit 1; }
          [ "$rel" = "1" ] || {
            echo "::error::Release is '$rel', not nfpm's default 1 — a release: key was added and this gate has not measured it"; exit 1; }

      # Same proof discipline as the .deb, both directions — the file must be
      # ABSENT from the bouncer's payload and delivered by the client package.
      # Like the arch source build, this also confirms shottino compiled on
      # this toolchain (Fedora's gcc) and links THIS host's ncursesw/openssl.
      - name: Prove the client moved packages — out of the bouncer, into its own
        run: |
          pkg="$(find dist -name 'grappa-*.rpm' -print -quit)"
          if rpm -qpl "$pkg" | grep -qx '/usr/bin/shottino'; then
            echo "::error::the bouncer .rpm still ships /usr/bin/shottino"; exit 1
          fi
          test -x /usr/bin/shottino || { echo "::error::/usr/bin/shottino missing after installing both packages"; exit 1; }
          rpm -qf /usr/bin/shottino | grep -q '^shottino-' || {
            echo "::error::/usr/bin/shottino is not owned by the shottino package"
            rpm -qf /usr/bin/shottino; exit 1; }
          /usr/bin/shottino --help > /tmp/shottino-help.txt
          grep -q '^usage: ' /tmp/shottino-help.txt || {
            echo "::error::shottino --help produced no usage output"; cat /tmp/shottino-help.txt; exit 1; }
          echo "shottino OK: $(/usr/bin/shottino --help | head -1)"

      # #1447 — the STANDALONE client package's own metadata, read off the
      # artifact. The deb job runs the same three proofs through dpkg-deb;
      # here they go through rpm, where nfpm renders `replaces:` as Obsoletes:
      # and drops the deb-only Breaks.
      - name: Prove the standalone shottino package is thin and takes the path over
        run: |
          pkg="$(find dist-shottino -name 'shottino-*.rpm' -print -quit)"
          [ -n "$pkg" ] || { echo "::error::no standalone shottino .rpm in dist-shottino/"; exit 1; }
          echo "package: $pkg"
          rpm -qpi "$pkg"

          files="$(rpm -qpl "$pkg")"
          echo "contents: $files"
          [ "$files" = "/usr/bin/shottino" ] || {
            echo "::error::expected exactly /usr/bin/shottino, got: $files"; exit 1; }

          # nfpm maps `replaces:` to Obsoletes: on rpm (rpm/rpm.go), so this is
          # the same declaration the .deb spells as Replaces:. Anchored on the
          # end of line: `grappa < 1.3.0` is a PREFIX of the cured
          # `grappa < 1.3.0~`, so an unanchored fixed-string match cannot tell
          # the pre-#1594 boundary from this one and would pass on either.
          rpm -qp --obsoletes "$pkg" | grep -qE '^grappa < 1\.3\.0~$' || {
            echo "::error::Obsoletes: is not the literal grappa < 1.3.0~"
            rpm -qp --obsoletes "$pkg"; exit 1; }

          want="$(infra/packaging/pkgversion.sh rpm shottino)"
          got="$(rpm -qp --queryformat '%{VERSION}' "$pkg")"
          echo "client version: '$got' (want '$want')"
          [ "$got" = "$want" ] || {
            echo "::error::client package is stamped '$got', expected '$want'"; exit 1; }

      # One upload step per artifact — see the sibling note in the `deb` job.
      - name: Upload .rpm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grappa-rpm
          path: dist/*.rpm
          if-no-files-found: error

      - name: Upload the client .rpm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shottino-rpm
          path: dist-shottino/*.rpm
          if-no-files-found: error

  docker:
    name: build + push release images (ghcr, amd64 + arm64)
    # THREE trigger shapes, not two:
    #
    #   * tag push                     → builds the tag, PUBLISHES to ghcr. The
    #                                    byte-for-byte shipping behavior.
    #   * docker_validation dispatch   → dry-run: builds the DISPATCHED BRANCH
    #                                    both arches, push:false, no login,
    #                                    publishes NOTHING. The pre-tag gate.
    #   * repair dispatch (tag input)  → builds the TAG's tree with the image
    #                                    build scaffolding taken from the
    #                                    dispatched ref, and PUBLISHES.
    #
    # The repair path used to be refused here, on the grounds that image repair
    # is out of scope and a broken image means "cut another tag". v1.0.0 is why
    # that rule did not survive contact: `mix release` runs the #1158 operator-CLI
    # step, Dockerfile.release did not COPY `infra/`, and the image job died at
    # assembly (run 31656721237) — while deb, rpm and Arch built, were proven and
    # were attached. So the release exists, its packages exist, and its images do
    # not; `:latest` still resolved to the PREVIOUS release, which is what an
    # operator's `docker pull` gets. Forcing a version bump to republish an
    # already-shipped tag's images is worse than rebuilding them: it invents a
    # release nobody wrote notes for.
    #
    # What the repair path is allowed to differ on is deliberately narrow: the
    # BUILD SCAFFOLDING (Dockerfile.release, Dockerfile.shottino, .dockerignore,
    # infra/docker) comes from the dispatched ref, everything the image actually
    # SHIPS comes from the tag. That is the same principle #504 already applied to
    # the package jobs — "dispatching from main runs the FIXED workflow against
    # the tag" — extended from the workflow file to the build recipe it drives,
    # because here the recipe IS the workflow's broken part. The scaffolding
    # commit is stamped into the image as its own OCI label, so the difference is
    # readable off the artifact and never has to be reconstructed from run logs.
    #
    # A repair dispatch with an EMPTY tag input is not a repair: it falls through
    # to no job at all, rather than silently republishing main as some tag.
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.docker_validation) || (github.event_name == 'workflow_dispatch' && !inputs.docker_validation && inputs.tag != '') }}
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE the workflow default (contents: write) for
    # this job — so re-grant `contents: read` for checkout and ADD
    # `packages: write` to push to ghcr with the ambient GITHUB_TOKEN (used on
    # the tag-push and repair paths; a dry-run never logs in or pushes).
    permissions:
      contents: read
      packages: write
    env:
      # ONE definition of "this is a repair run", referenced by every step that
      # has to behave differently. Re-deriving the condition per step is how the
      # publish gate and the checkout gate drift apart — and a drift here means
      # either publishing the wrong tree or not publishing at all. Note the
      # STRING comparison at each use: workflow-level `env` is text, never bool.
      IMAGE_REPAIR: ${{ github.event_name == 'workflow_dispatch' && !inputs.docker_validation && inputs.tag != '' }}
      # Empty on the two non-repair paths, where the checkout takes its default.
      REPAIR_TAG: ${{ github.event_name == 'workflow_dispatch' && !inputs.docker_validation && inputs.tag || '' }}
    steps:
      - name: Checkout (the TRIGGERING ref; tags for #391 + :latest gate)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # image build COPYs only in-tree paths (cicchetto is a plain subdir);
          # the declared submodules are test-only, one behind a `git@` SSH URL the
          # ambient token cannot fetch — `recursive` would only add failure surface.
          submodules: false
          # Empty on the tag-push and dry-run paths, where the default checkout is
          # exactly right: the pushed TAG on a release, the DISPATCHED BRANCH on a
          # docker_validation dry-run (which is what makes the dry-run executable
          # at all — the branch tree carries a WORKING Dockerfile.release). On a
          # repair dispatch it is the tag being repaired, because there the thing
          # being republished is that tag's tree and nothing else. fetch-depth 0
          # pulls tags for the version gate + the :latest check, and on the repair
          # path it is also what makes the dispatched ref's commit reachable for
          # the scaffolding step below. The image build itself takes the no-git
          # bare-version path (.git is .dockerignore'd).
          ref: ${{ env.REPAIR_TAG }}
          fetch-depth: 0

      # The one deliberate difference between a repair build and the tag's own
      # build. `git checkout <sha> -- <paths>` overwrites ONLY these paths in the
      # work tree; HEAD stays on the tag, so `git rev-parse HEAD` below still
      # reports the tag's commit as the image revision — which is honest, because
      # every byte the image ships still comes from the tag.
      #
      # The list is the build recipe and nothing else. `lib`, `config`, `priv`,
      # `mix.exs`, `mix.lock`, `VERSION` and `cicchetto` are POINTEDLY absent: the
      # moment source joins this list, the artifact stops being the tag and the
      # label lies.
      #
      # The two `infra/packaging` scripts are the exception that proves it, and
      # they are WORKFLOW LOGIC rather than shipped bytes (#1686). The `:latest`
      # gate below calls them, and the tree this job checks out on a repair is
      # the OLD TAG's: `git tag --contains d622616d` answers `v1.3.0 v1.3.1`, so
      # every earlier tag predates `prerelease_flag.sh` and the call would die
      # 127 on a path that works today. Taking them from the dispatched ref is
      # the same principle the whole repair path rests on — "dispatching from
      # main runs the FIXED workflow against the tag" — extended to the two
      # helpers that workflow now reasons with. MEASURED not to touch the
      # artifact: `Dockerfile.release` COPYs exactly two files out of
      # infra/packaging (`version.sh`, `gen-secrets.sh`) and neither is one of
      # these, so the image is byte-for-byte the tag's either way.
      - name: Repair path — take the image build scaffolding from the dispatched ref
        if: ${{ env.IMAGE_REPAIR == 'true' }}
        run: |
          echo "repairing ${REPAIR_TAG} ($(git rev-parse --short HEAD)) with scaffolding from ${GITHUB_SHA}"
          git checkout "${GITHUB_SHA}" -- \
            Dockerfile.release \
            Dockerfile.shottino \
            .dockerignore \
            infra/docker \
            infra/packaging/latest_tag_gate.sh \
            infra/packaging/prerelease_flag.sh
          # Print it. A repair that silently changed nothing means the tag was
          # already fine and the failure is elsewhere; a repair that changed more
          # than expected is the reviewer's business, not a surprise found later
          # by diffing images.
          echo "scaffolding delta vs the tag:"
          git --no-pager diff --stat HEAD --

      - name: Resolve version (repo-root VERSION file = SSOT)
        id: ver
        run: |
          version="$(infra/packaging/version.sh)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            # Real release: the pushed tag MUST match the VERSION file, same gate
            # as deb/arch/rpm. GITHUB_REF_NAME is the tag on a tag push.
            tag_ver="${GITHUB_REF_NAME#v}"
            echo "pushed tag=${tag_ver} VERSION=${version}"
            if [ "${tag_ver}" != "${version}" ]; then
              echo "::error::pushed tag v${tag_ver} does not match the VERSION file ${version} — bump VERSION before cutting the tag"
              exit 1
            fi
          elif [ "${IMAGE_REPAIR}" = "true" ]; then
            # Same gate, dispatched input instead of the pushed ref. It is not
            # ceremony: this run PUBLISHES `:v<VERSION>`, and VERSION is read from
            # the checked-out tree. A typo'd tag input would otherwise publish a
            # tag's tree under a DIFFERENT version's name and quietly move
            # `:latest` onto it.
            tag_ver="${REPAIR_TAG#v}"
            echo "repair dispatch tag=${tag_ver} VERSION=${version}"
            if [ "${tag_ver}" != "${version}" ]; then
              echo "::error::dispatched tag ${REPAIR_TAG} does not match that tree's VERSION file ${version} — repair republishes a tag's own images, it does not re-version them"
              exit 1
            fi
          else
            echo "docker_validation dry-run: building ${GITHUB_REF_NAME} @ VERSION ${version} — push:false, NOTHING will be published"
          fi

      - name: Resolve the built commit (OCI revision label)
        id: rev
        run: |
          # The commit actually built (the tag's commit on push AND on a repair,
          # the branch HEAD on a dry-run) — never github.sha, which is the
          # dispatched branch's HEAD, not the thing being built.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # The commit the BUILD RECIPE came from. Equal to the revision on every
          # path except a repair, where it is the dispatched ref. Stamped as its
          # own label so "why does this image's Dockerfile not match its
          # revision's" is answerable from `docker inspect`, months later, by
          # someone who never saw this run.
          if [ "${IMAGE_REPAIR}" = "true" ]; then
            echo "scaffolding=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "scaffolding=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image names + tag lists
        id: img
        run: |
          # ghcr repositories MUST be lowercase; the owner may not be.
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          name="ghcr.io/${owner}/grappa"
          # The bridge is a SECOND repository, not a tag of the first: a
          # manifest list holds one image per PLATFORM, so `grappa:<tag>` for
          # arm64 is already taken by the bouncer (#1168).
          shottino_name="ghcr.io/${owner}/grappa-shottino"
          version="${{ steps.ver.outputs.version }}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "shottino_name=${shottino_name}" >> "$GITHUB_OUTPUT"

          # :v<version> always; :latest ONLY when v<version> is the highest
          # RELEASE tag in the repo. TWO hazards, ONE gate: a backport tag push
          # (v0.7.5 after v0.8.0) must not re-point `:latest` at an OLDER image,
          # and a release candidate must not take it at all. deb/rpm/arch are
          # immune (they attach to a tag-keyed Release); only the docker images
          # have a MUTABLE `:latest`. These tags are USED only when push:true —
          # a dry-run (push:false) computes but discards them.
          #
          # The ranking used to be `git tag -l 'v*' --sort=-v:refname | head -1`
          # written out here, and `versionsort.suffix` is unset in this repo, so
          # git placed `-rcN` ABOVE the bare version. Both faces were read off
          # the runs' own logs (#1686): v1.3.0-rc2 took `:latest`, and v1.3.0 was
          # then DENIED it by its own candidate. The rule now lives in ONE script
          # that reuses the ONE pre-release classifier — a second hand-rolled
          # semver comparison is exactly how two `:latest` owners come to drift.
          #
          # A verdict that cannot be derived STOPS the job. The permissive
          # reading — carry on with an empty `latest` — is the one that
          # publishes, and this decision is not retractable from a registry.
          if ! latest="$(infra/packaging/latest_tag_gate.sh "v${version}")"; then
            echo "::error::cannot decide :latest for v${version} — refusing to publish images whose mutable tag was never derived (#1686)"
            exit 1
          fi

          # ONE gate, BOTH images (#1168). Bouncer and bridge are cut from the
          # SAME tag, so the backport decision above has to reach both — and a
          # second hand-copied semver comparison is exactly how two `:latest`
          # pointers drift onto different releases.
          emit_tags() {
            repo="$1"
            key="$2"
            echo "${key}<<TAGS_EOF" >> "$GITHUB_OUTPUT"
            echo "${repo}:v${version}" >> "$GITHUB_OUTPUT"
            if [ "${latest}" = yes ]; then
              echo "${repo}:latest" >> "$GITHUB_OUTPUT"
            fi
            echo "TAGS_EOF" >> "$GITHUB_OUTPUT"
          }
          emit_tags "${name}" tags
          emit_tags "${shottino_name}" shottino_tags

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          # The arm64 leg is emulated on the amd64 runner, and an OLD QEMU
          # crashes the emulated BEAM JIT (BeamAsm) at the first `mix` call with
          # `{failed_to_start_child,user,nouser}` — reproduced locally on a
          # stale Docker-Desktop binfmt and FIXED by a recent one (#503 unit C
          # validation). `:latest` is deliberately FLOATING-for-freshness (not a
          # reproducibility pin): it guarantees the JIT fix, at the small cost
          # that a future binfmt regression could reappear — which the mandatory
          # workflow_dispatch smoke before a real tag would catch. amd64 builds
          # NATIVE here (no emulation), so only arm64 depends on this.
          image: tonistiigi/binfmt:latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        # Both publishing paths (tag push, repair). A docker_validation dry-run
        # never authenticates to the registry, so it CANNOT publish — that is the
        # dry-run's guarantee, and it stays a property of the credentials, not of
        # a flag someone could flip by mistake.
        if: ${{ github.event_name == 'push' || env.IMAGE_REPAIR == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-arch release image (push only on a real tag)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.release
          # F1 (vjt, 2026-07-31): heterogeneous self-host audience → ship both.
          # arm64 builds under QEMU emulation (slow — the gha cache below keeps
          # re-runs cheap).
          platforms: linux/amd64,linux/arm64
          # ZERO PUBLICATION on a dry-run: push on a tag push and on a repair. A
          # docker_validation dispatch still builds BOTH arches (proving the
          # arm64 QEMU path + the ABI-lockstep assertion + cic + mix release) and
          # then discards them — nothing reaches ghcr, no `:latest` moves.
          push: ${{ github.event_name == 'push' || env.IMAGE_REPAIR == 'true' }}
          # `:v<version>` always; `:latest` only when highest (see the "Compute
          # image name + tag list" step). Consumed only when push:true.
          tags: ${{ steps.img.outputs.tags }}
          # OCI labels so the ghcr package page links back to source + the
          # exact tag/commit it was built from. `revision` is the tree that was
          # BUILT; the grappa-specific label next to it is the commit the build
          # recipe came from, which differs only on a repair (see the rev step).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
            chat.grappa.image.scaffolding-revision=${{ steps.rev.outputs.scaffolding }}
          # SCOPED (#1168): two builds in one job share the gha cache backend,
          # and the default scope is one bucket — unscoped, the bridge build
          # would evict the bouncer's layers on every release and vice versa.
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
          # Keep the manifest a plain multi-arch image (no attestation manifest)
          # so `docker pull ghcr.io/<owner>/grappa` resolves cleanly on both
          # arches without the extra unknown/unknown provenance entry.
          provenance: false

      - name: Build multi-arch bridge image (push only on a real tag)
        # SECOND, deliberately. Steps run in order and the bouncer image is
        # already pushed by the time this runs, so a shottino compile error
        # leaves the release image published and turns the job red on its own
        # — the same call DESIGN_NOTES makes for the jail deploy, where a
        # CLIENT compile must never withhold a SERVER artifact. Reversed, one
        # bad C commit would hold back the thing people actually came for.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.shottino
          # Same matrix as the bouncer: an arm64 operator who has to compile
          # the bridge is the exact problem #1168 exists to remove, and
          # halving the audience would only half-close it. Cheap, too — the
          # bridge is ~12 C files against ncursesw/openssl, tens of seconds
          # under emulation, next to a full ERTS + SPA build in this same job.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || env.IMAGE_REPAIR == 'true' }}
          tags: ${{ steps.img.outputs.shottino_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
            chat.grappa.image.scaffolding-revision=${{ steps.rev.outputs.scaffolding }}
          cache-from: type=gha,scope=release-shottino
          cache-to: type=gha,mode=max,scope=release-shottino
          provenance: false

  smoke:
    name: deploy + probe the release image (amd64)
    needs: [docker]
    # Exactly the docker job's trigger set, all three shapes: a real tag and a
    # repair (probe what was just PUBLISHED) or a docker_validation dry-run
    # (probe what was just built). There is no skip — if the image cannot be
    # obtained, this job FAILS. A smoke test that quietly passes having tested
    # nothing is worse than not having one, and a repair is precisely the run
    # you least want to take on trust: it publishes a mixed tree.
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.docker_validation) || (github.event_name == 'workflow_dispatch' && !inputs.docker_validation && inputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # Same single definition as the docker job — see its comment.
      IMAGE_REPAIR: ${{ github.event_name == 'workflow_dispatch' && !inputs.docker_validation && inputs.tag != '' }}
      # On a repair the driver AND the version must come from the tag, or this
      # job would probe `:v<main's VERSION>` — an image this run never touched.
      REPAIR_TAG: ${{ github.event_name == 'workflow_dispatch' && !inputs.docker_validation && inputs.tag || '' }}
    steps:
      - name: Checkout (the ref whose image is under test — it carries the smoke driver)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same reasoning as the docker job: the pushed TAG on a release, the
          # DISPATCHED BRANCH on a dry-run, the REPAIRED TAG on a repair.
          # submodules:false + fetch-depth 1 — the driver is shell over infra/
          # and reads no git history.
          submodules: false
          ref: ${{ env.REPAIR_TAG }}

      - name: Resolve version (repo-root VERSION file = SSOT)
        id: ver
        run: echo "version=$(infra/packaging/version.sh)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        # The two publishing paths pull from the registry; the dry-run builds
        # locally and never authenticates.
        if: ${{ github.event_name == 'push' || env.IMAGE_REPAIR == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the PUBLISHED image (tag + repair paths)
        id: pull
        if: ${{ github.event_name == 'push' || env.IMAGE_REPAIR == 'true' }}
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/grappa:v${{ steps.ver.outputs.version }}"
          # The honest subject: the exact ref an operator's deploy.sh resolves.
          docker pull "$image"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx (dry-run path)
        # docker_validation ONLY. A repair is also a workflow_dispatch but it
        # PUBLISHES, so it takes the pull path above; re-exporting from cache
        # there would probe a local image instead of the pushed one.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.docker_validation }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Re-export the amd64 image from the build cache (dry-run path)
        id: build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.docker_validation }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.release
          # amd64 ONLY and load:true — a multi-arch manifest cannot be loaded
          # into the local docker daemon, and this job has to RUN the thing.
          # The docker job wrote the full cache moments ago (needs:), so this
          # re-exports cached layers rather than rebuilding.
          platforms: linux/amd64
          load: true
          push: false
          tags: grappa-release:smoke
          # MUST name the same scope the docker job's bouncer build writes
          # (#1168). That build is scoped now, because the bridge build shares
          # this job's gha cache backend; an unscoped `cache-from` here would
          # look in the default bucket, find nothing, and silently rebuild the
          # whole release image instead of re-exporting it.
          cache-from: type=gha,scope=release
          provenance: false

      - name: Deploy the image for real and probe it
        env:
          # Whichever path ran; the other's output is empty.
          GRAPPA_IMAGE: ${{ steps.pull.outputs.image || 'grappa-release:smoke' }}
          GRAPPA_SMOKE_VERSION: ${{ steps.ver.outputs.version }}
        run: scripts/smoke-release-image.sh

  publish:
    name: publish GitHub Release assets
    needs: [deb, arch, rpm]
    # Run once BOTH package jobs have settled, even if one FAILED (only a run
    # cancel skips this). A distro-specific breakage (#504 defect 2) must not
    # withhold the artifacts that built green: the attach step collects whatever
    # actually downloaded and fails loudly only if NOTHING did. The failed leg
    # stays red on its own, so the run is still marked failed and gets fixed.
    # NARROWED BY #1591: the step still RUNS on a red leg, but it now refuses
    # to CREATE a release from an incomplete set — that publication cannot be
    # taken back. Topping up an EXISTING release is unchanged. The gate is in
    # the attach step, not here, because it needs the downloaded asset set.
    # ALSO skipped on a docker-image dry-run dispatch (its needs are skipped and
    # there is nothing to publish) — else it would fail "no artifacts present".
    if: ${{ !cancelled() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.docker_validation)) }}
    runs-on: ubuntu-latest
    env:
      # The release to attach to — the input on a repair dispatch, else the
      # pushed tag. The release object is keyed by this tag NAME, so a dispatch
      # uploads to the EXISTING release without any tag surgery.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout (for the release-asset audit script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # publish needs infra/packaging/release_assets.sh (the expected-vs-
          # arrived audit + the partial-release body marker). NO ref override —
          # take the TRIGGERING ref, exactly like the docker job: the pushed tag
          # on a release (it carries the script, committed before the tag) or
          # the dispatched branch on a #573 (b) repair (it carries the FIXED
          # script, whereas an OLD tag like v0.8.0 predates this work entirely).
          # submodules:false — the audit is pure shell; fetch-depth 1 — no git
          # history is read here. MUST run before download-artifact: checkout's
          # default clean (git clean -ffdx) would otherwise wipe assets/.
          submodules: false

      - name: Download built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets

      - name: Audit the set, refuse to create a partial release, attach what built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find assets -type f -print
          # #504 defect 2 — attach ONLY the assets that actually downloaded. A
          # failed leg never uploaded its artifact, so its files simply are not
          # here; attaching what IS present publishes the green artifacts
          # regardless, and the dead leg stays red on its own.
          #
          # `found` matches by NAME at ANY DEPTH from the SSOT expected-kinds
          # table (infra/packaging/release_assets.sh), not a path-coupled glob:
          # in run 30399152630 download-artifact unpacked the one green artifact
          # FLAT into assets/ and a path glob matched nothing while the .deb sat
          # right there. Extracting the glob into that script is what lets the
          # audit below share ONE definition of "expected" — the whole #573 fix
          # is that the attach list and the completeness check can never drift.
          mapfile -t assets < <(infra/packaging/release_assets.sh found assets)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no build artifacts present — every package job failed; nothing to publish"
            exit 1
          fi
          printf 'attaching: %s\n' "${assets[@]}"

          # #1591 — CREATING a release is irreversible in a way topping one up
          # is not: `gh release create` publishes, and deleting the tag
          # afterwards does not retract it. Cutting v1.3.0-rc1 did exactly
          # that, with a dead Arch leg and a public release object. So the
          # #504/#573 posture is kept where its reasoning holds — an existing
          # release still gets whatever built, marked partial — and refused
          # where it does not: the first run of a fresh tag must be complete.
          # A re-run after the fix then CREATES the release cleanly, which the
          # old order could not do at all.
          #
          # `gh release view` failing is read as "absent", the conservative
          # side: a probe that errors for an unrelated reason makes this
          # refuse, never publish.
          release_state=absent
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            release_state=present
          fi
          if verdict="$(infra/packaging/release_assets.sh publishable assets "$release_state")"; then
            [ -z "$verdict" ] || printf '%s\n' "$verdict"
          else
            printf '%s\n' "$verdict"
            {
              echo "## ⛔ Release NOT created"
              echo
              printf '%s\n' "$verdict"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::incomplete package set — refusing to create a new release for ${RELEASE_TAG} (#1591)"
            exit 1
          fi

          # #1636 — DERIVE the pre-release marker from the tag being published.
          # This call used to carry no marker at all, so every candidate was
          # published as a full release: v1.3.0-rc1 reads as a pre-release only
          # because a human flipped it after the run, and v1.3.0-rc2 was missed.
          # GitHub picks "Latest" among the non-draft, non-pre-release releases,
          # so a green candidate run is the only thing between a release
          # candidate and the repository's landing page.
          #
          # The tag, not the checked-out VERSION: on a #573 (b) repair dispatch
          # the tree is the DISPATCHED ref while the release object is keyed by
          # the dispatched tag input, and the two need not agree.
          #
          # A tag the script cannot classify STOPS the step. The permissive
          # answer is the one that publishes, so an unparseable tag must not be
          # silently treated as a stable release.
          if ! prerelease_flag="$(infra/packaging/prerelease_flag.sh "${RELEASE_TAG}")"; then
            echo "::error::cannot classify ${RELEASE_TAG} — refusing to publish a release whose marker was never derived (#1636)"
            exit 1
          fi
          echo "release marker for ${RELEASE_TAG}: ${prerelease_flag}"

          # Create the release on first run; on a re-run (or a #573 (b) repair
          # dispatch to an existing release) fall back to uploading with
          # --clobber. BUILD ≠ PUBLISH TO AUR: the PKGBUILD/.SRCINFO ride along
          # as assets a human pushes to aur.archlinux.org — nothing here does.
          if ! gh release create "${RELEASE_TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "grappa ${RELEASE_TAG}" \
                --generate-notes \
                "${prerelease_flag}" \
                "${assets[@]}"; then
            gh release upload "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" --clobber \
              "${assets[@]}"
          fi

          # State the hole out loud (#573). A partial release used to be
          # indistinguishable from a complete one AT THE ARTIFACT LIST — two
          # releases shipped without their .rpm and the red-and-ignored run was
          # the only trace. Now: name every missing kind in the job summary AND
          # in the release BODY. GitHub's own run-failure notification already
          # fired for both losses and nobody acted, so the body marker — what a
          # human landing on the release page actually reads — is the
          # load-bearing signal, not the notification.
          missing="$(infra/packaging/release_assets.sh missing assets)"
          if [ -n "$missing" ]; then
            {
              echo "## ⚠️ Partial release"
              echo
              echo "\`${RELEASE_TAG}\` is missing expected package(s):"
              echo
              while IFS= read -r label; do echo "- ${label}"; done <<< "$missing"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Reconcile the body idempotently: apply-body PREPENDS a sentinel
          # marker when the set is incomplete and STRIPS a stale one when a (b)
          # repair dispatch has since completed the set (the converse). Edit
          # only when the body actually changed, so a complete set on a clean
          # body is a no-op and a re-run never accretes duplicate blocks.
          old_body="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json body -q .body)"
          new_body="$(printf '%s' "$old_body" | infra/packaging/release_assets.sh apply-body assets)"
          if [ "$new_body" != "$old_body" ]; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --notes "$new_body"
          fi
