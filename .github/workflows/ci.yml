name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Avoid duplicate runs on PRs from same-repo branches
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.19.5"
  OTP_VERSION: "28.5"

jobs:
  test:
    name: test + lint + audit
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps + build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Format check
        run: mix format --check-formatted

      - name: Credo (strict)
        run: mix credo --strict

      - name: Sobelow (fail on Medium+)
        run: mix sobelow --config --exit Medium

      - name: Hex audit (CVE check)
        # Advisory-only (non-blocking): cowlib has two UNFIXABLE cow_cookie
        # advisories (CVE-2026-43969 LOW + CVE-2026-43966 MED, fixed=None,
        # no patched release) that are N/A to grappa (we only consume Cookie
        # headers via Plug, never compose request cookies via cow_cookie).
        # hex.audit has no per-advisory ignore, so it can't express that.
        # `mix deps.audit` below remains the HARD, blocking CVE gate.
        # Restore this to blocking when cowlib ships a patch — see #149.
        continue-on-error: true
        run: mix hex.audit

      - name: Mix audit (CVE check)
        run: mix deps.audit

      - name: Doctor (doc + @spec coverage)
        run: mix doctor

      - name: Install media tools (MetadataStrip shells out to them)
        # `Grappa.Uploads.MetadataStrip` (#39) is fail-CLOSED: tests
        # exercise real exiftool/ffmpeg invocations on committed
        # GPS-tagged fixtures. The Docker image gets these via
        # `apk add`; this job runs on the bare runner via setup-beam,
        # so install them here or every strip test fails with
        # "exiftool not found on PATH" (red main 2026-06-10).
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libimage-exiftool-perl ffmpeg

      - name: Tests with coverage
        run: mix coveralls.json --warnings-as-errors

      - name: Bats (bin/grappa dispatcher + debug-attach + infra deploy)
        # Mirror scripts/bats.sh's discovery set so the CI gate matches the
        # local check.sh gate (#364 docker S2 added test/scripts/; #503
        # added test/infra/ — the deploy-orchestrator decision-logic
        # suites that were previously local-only). Run the bats binary
        # directly (submodule already checked out in CI) rather than
        # scripts/bats.sh, which would drag in _lib.sh's docker-compose
        # arg wiring the bare runner doesn't need.
        run: vendor/bats-core/bin/bats test/bin/ test/infra/ test/scripts/

      - name: Shellcheck + POSIX-lint deploy scripts (#503 anti-drift)
        # The shared deploy lib (infra/lib/deploy_common.sh) MUST stay
        # strict POSIX sh so dash can run it on the FreeBSD jail (/bin/sh).
        # Lint the lib as sh, the three consumers with -x (they source the
        # lib), and dash -n parse the POSIX pieces so a reintroduced
        # bashism in the shared algorithm fails CI instead of silently
        # breaking the jail deploy — the exact copy-paste-drift class #503
        # exists to kill.
        run: |
          shellcheck -s sh infra/lib/deploy_common.sh infra/docker/assert-abi-lockstep.sh infra/docker/release-entrypoint.sh infra/docker/get.sh
          shellcheck -x infra/freebsd/deploy.sh infra/linux/deploy.sh scripts/deploy.sh infra/docker/deploy.sh
          dash -n infra/lib/deploy_common.sh
          dash -n infra/freebsd/deploy.sh
          dash -n infra/docker/assert-abi-lockstep.sh
          dash -n infra/docker/release-entrypoint.sh
          dash -n infra/docker/get.sh
          # #665 cloud bootstrap + drift-guard (bash, not the POSIX-sh lib).
          shellcheck -x infra/cloud/first-boot.sh infra/cloud/check-drift.sh

      - name: Cloud provider-door drift-guard (#665)
        # Prove every provider door (infra/aws today, infra/terraform later)
        # INVOKES the shared infra/cloud/first-boot.sh from its UserData/
        # user_data block, binds every knob marker from infra/cloud/params.contract
        # to a real parameter, and exports exactly the env the bootstrap
        # requires. All three read the executable surface — a prose mention or
        # an orphaned marker satisfies none of them (#746). A hand-written
        # second door that drifts from the contract fails here, not silently.
        run: infra/cloud/check-drift.sh

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: always()
        with:
          files: ./cover/excoveralls.json
          fail_ci_if_error: false

  # shottino is C, so none of the Elixir gates above say anything about it.
  # Before this job nothing in CI compiled it at all: a change that broke
  # the build (or the wire narrowers) reached main unnoticed and would
  # first surface in the release workflow, on a tag, when the packages
  # tried to build a client that no longer compiled.
  #
  # What it covers, exactly: the client is built and its suites run, and
  # the media helper's sources are COMPILED but never linked and never
  # packaged — the shipped .deb/AUR carry the client alone and fall back
  # to a browser for calls, so nothing here proves a helper binary works.
  #
  # Deliberately its own job rather than a step on `test`: it shares no
  # toolchain with the BEAM jobs (no Elixir, no deps cache), it runs in
  # well under a minute, and a failure should read as "shottino broke"
  # rather than as a red mark on the Elixir suite.
  shottino:
    name: shottino (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The three things ./configure probes for. libncurses-dev is the
      # package that ships ncursesw.pc — shottino links the WIDE build
      # (it is UTF-8 end to end), and the old libncursesw5-dev name no
      # longer exists on current Debian/Ubuntu.
      #
      # ffmpeg is a TEST dependency, and it is here because it was not:
      # the runner has no ffmpeg, so every green run of this job printed
      # "test_layout: no ffmpeg — skipping decode checks" and the one test
      # that asks the real decoder what it produced asserted nothing. It
      # now fails instead of skipping (#763), so the binary has to be here
      # for the check to mean what its name says.
      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            pkg-config libncurses-dev libssl-dev ffmpeg

      - name: Configure
        run: ./configure

      # -Werror here but NOT in the shipped Makefile: a new warning must
      # fail CI, while a user building from source on a newer compiler
      # that emits some novel diagnostic should still get a client.
      # CFLAGS_DEPS is re-appended because overriding CFLAGS drops the
      # feature-test macros configure detected (strcasestr, cfmakeraw).
      - name: Build (warnings are errors)
        run: |
          make -C frontends/shottino clean
          make -C frontends/shottino \
            CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -O2 $(sed -n 's/^CFLAGS_DEPS := //p' config.mk)"

      # The media helper is a separate opt-in target (`make call`) because
      # linking it wants cmake, a C++ toolchain and a multi-minute
      # libdatachannel build. So `make` above never touched call/main.c —
      # 1214 lines, the helper's main loop and the whole libdatachannel
      # integration — and no other job did either (#754). Compiling it is
      # what that guarantee costs here: the vendored headers arrived with
      # the recursive checkout, nothing has to be built, and the flags are
      # the ones above so the helper cannot warn where the client may not.
      # The link stays unproven on purpose — see the Makefile comment.
      - name: Compile the media helper (warnings are errors)
        run: |
          make -C frontends/shottino call-compile \
            CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -O2 $(sed -n 's/^CFLAGS_DEPS := //p' config.mk)"

      # Suites build with ASan+UBSan (see the Makefile): this is C parsing
      # attacker-shaped input off a websocket, and a leak or a one-past-
      # the-end read in the arena is exactly what a plain assertion suite
      # passes straight over.
      - name: Tests (ASan + UBSan)
        run: make -C frontends/shottino check

  dialyzer:
    name: dialyzer
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps + build + PLTs
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-plt-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}-v1
          restore-keys: |
            ${{ runner.os }}-plt-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install deps + compile
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile

      - name: Build PLT (cached)
        run: mix dialyzer --plt

      - name: Run Dialyzer
        run: mix dialyzer --format short

      # Docs build lives in this job because ex_doc is `only: [:dev]` in
      # mix.exs (we don't want it pulled into the test runner). The
      # dialyzer job already runs in MIX_ENV=dev with deps+_build cached,
      # so adding a docs step here costs nothing extra.
      - name: Build docs (no warnings)
        run: mix docs

  # cicchetto is TypeScript, so none of the gates above say anything about
  # it. Before this job, CI ran zero lines of JavaScript on a JS change:
  # the SPA is built only inside integration.yml (docker compose ->
  # cicchetto-build-test + playwright-runner), which is path-filtered.
  # A dependency bump that broke types, lint or the unit suite could reach
  # main with three green Elixir checks (#714 — the path filter itself is
  # fixed in #715; this job is the complement, not the substitute: it runs
  # unconditionally and in ~2 min, where the e2e runs conditionally in ~30).
  #
  # Deliberately its own job, same reasoning as shottino: no BEAM
  # toolchain, no deps cache, and a failure should read as "cicchetto
  # broke" rather than as a red mark on the Elixir suite.
  cicchetto:
    name: cicchetto (types + lint + unit)
    runs-on: ubuntu-latest
    # The same digest-pinned oven/bun the cicchetto-build-test service uses
    # in compose.yaml (#103 supply-chain). Checking types with the exact
    # runtime that builds the bundle means one bump moves both, instead of
    # CI and the build image drifting apart on separate bun versions.
    # Refresh on an intentional bump:
    #   docker buildx imagetools inspect oven/bun:1 --format '{{.Manifest.Digest}}'
    container:
      image: oven/bun:1@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
    defaults:
      run:
        working-directory: cicchetto
    steps:
      # No submodules: bats-core and friends are Elixir/shell-side only.
      - uses: actions/checkout@v7

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('cicchetto/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # --frozen-lockfile so a lockfile that disagrees with package.json
      # fails here instead of silently resolving to something else than
      # what the build and the e2e runner install.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `check` is biome check src && tsc --noEmit — the same gate the
      # local pre-commit path runs, so CI and the developer see one rule.
      - name: Biome + typecheck
        run: bun run check

      - name: Unit tests (vitest)
        run: bun run test
