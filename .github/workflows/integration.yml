name: integration

# E2E integration suite — boots the full stack (azzurra-testnet + grappa
# + nginx + cicchetto SPA build + Playwright runner) via
# `scripts/integration.sh` and runs the M1-M12 + BUG7 matrix on chromium
# and webkit-iphone-15 projects.
#
# Path-filtered: only runs on changes that could break end-to-end
# behavior. Doc-only / CI-only changes don't trigger this (the
# Elixir-only ci.yml workflow handles unit-level gates on every push).
# The three orchestration scripts (integration.sh, testnet.sh, _lib.sh)
# ARE in scope — they boot the stack, set CONTAINER_UID, and wire the
# compose project together; a regression in them breaks CI but not
# local mac dev (different bind-mount semantics). Operator scripts
# (deploy.sh, observer.sh, etc.) stay out of scope deliberately.
#
# Dependency manifests are in scope on BOTH sides of the stack (#714).
# mix.exs/mix.lock were already listed; cicchetto/package.json and
# cicchetto/bun.lock were not, and the asymmetry meant a JavaScript
# dependency bump ran no JavaScript at all — ci.yml's three jobs are
# Elixir + bash only, and the SPA is built nowhere else but here. That
# is how a bundler upgrade (vite 8.1.5 -> 8.2.0, #708) merged green on
# `mix credo`. Same reasoning puts the root Dockerfile and compose.yaml
# in scope: they define the images the suite boots. The e2e-local
# Dockerfiles and compose files are already covered by cicchetto/e2e/**.
#
# That rule was stated here before it was applied (#1408 D-S8). Two e2e
# services build `grappa:e2e` with `context: ../..`, so `.dockerignore`
# governs what is tarred into that context — its own trailing entries
# (`.worktrees/`, the e2e cert dir) exist because a bad exclude BREAKS the
# build. And the cic build container mounts only ../../cicchetto, so it
# cannot read the version: `scripts/integration.sh` runs
# `infra/packaging/version.sh` over the repo-root `VERSION` and exports
# `GRAPPA_VERSION`, which an empty value makes vite fail loud on. All
# three are listed below. `bin/start.sh` is NOT, though it is the image
# CMD and is docker-COLD in preflight.ex: both services that build from
# the repo root override `command:`, so this suite never executes it.
#
# The two blocks below are byte-identical by necessity — GitHub Actions
# does not expand YAML anchors — and
# `test/infra/integration_path_filter_test.bats` is what keeps them so,
# and what derives the three entries above from the compose file and the
# script rather than trusting this comment.
#
# Stack timing: cold ~6-8 min for the testnet+grappa+nginx images +
# Playwright base pull; warm with cache it's faster but we don't cache
# docker layers cross-runs (would need a registry push, or buildx
# `type=gha` — unmeasured). The Elixir dep cache added in #1630 is a
# DIFFERENT mechanism and reaches a different 97.5s; the step carries the
# per-phase split of the boot that this line only totals. The "suite runs
# in ~16s" that stood here was true of the first dozen specs and has not
# been for a long time: measured 2026-08-20 it is 33.6 min of the 40.5,
# which is what #1519 shards. The per-shard numbers are on the job below.
#
# The suite is split across FOUR jobs (#1519), one Playwright `--shard`
# each, each with its OWN stack — sharding is N separate jobs, and it does
# NOT touch `workers: 1`, which stays load-bearing inside every shard
# (three long-lived users still share `#bofh`, see the issue).
#
# Failure artifacts: Playwright writes traces (zip), screenshots, and
# videos to cicchetto/e2e/test-results/ on test failure (configured in
# playwright.config.ts: trace=retain-on-failure, screenshot=only-on-failure,
# video=retain-on-failure, retries=0 — pass-or-fail, no flake masking). The HTML report lands in
# cicchetto/e2e/playwright-report/. Both are uploaded as artifacts when
# the job fails — the trace zip is the primary debug surface, opens in
# `npx playwright show-trace <zip>`.
#
# Those two are the BROWSER half only, and #702 is what that costs: a
# failure whose cause is upstream (grappa, bahamut, services) shows up in
# the trace as an unexplained absence, and the investigation stops there.
# scripts/integration.sh now dumps every container's log to
# cicchetto/e2e/container-logs/ on a non-zero exit — inside its own EXIT
# trap, because the tear-down in that same trap destroys the containers
# and no step here could reach them afterwards. Uploaded below, failure
# only.

on:
  # oidc: temporary lane trigger (fork-only, drop before the upstream PR)
  # so the acceptance job can be exercised by pushing the branch itself.
  workflow_dispatch:
  push:
    branches: [main, oidc]
    paths:
      - "lib/**"
      - "cicchetto/src/**"
      - "cicchetto/e2e/**"
      - "cicchetto/package.json"
      - "cicchetto/bun.lock"
      - "config/**"
      - "priv/**"
      - "scripts/integration.sh"
      - "scripts/testnet.sh"
      - "scripts/_lib.sh"
      - "mix.exs"
      - "mix.lock"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "VERSION"
      - "infra/packaging/version.sh"
      - "infra/oidc-e2e/**"
      - "scripts/oidc/**"
      - "scripts/oidc-e2e.sh"
      - ".github/workflows/integration.yml"
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "cicchetto/src/**"
      - "cicchetto/e2e/**"
      - "cicchetto/package.json"
      - "cicchetto/bun.lock"
      - "config/**"
      - "priv/**"
      - "scripts/integration.sh"
      - "scripts/testnet.sh"
      - "scripts/_lib.sh"
      - "mix.exs"
      - "mix.lock"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "VERSION"
      - "infra/packaging/version.sh"
      - "infra/oidc-e2e/**"
      - "scripts/oidc/**"
      - "scripts/oidc-e2e.sh"
      - ".github/workflows/integration.yml"

# Avoid duplicate runs on PRs from same-repo branches; cancel an
# in-flight run if a newer commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: cicchetto + grappa + azzurra-testnet (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # #1519 — FOUR jobs, each booting its own stack and running a quarter
    # of the suite. Measured on the green run 32395956800 (2026-08-20),
    # step timings read off the job log rather than estimated:
    #
    #   1.7 min  checkout (submodules) + compose plugin + GHCR login
    #   4.6 min  `testnet up`: mix deps.get + Elixir compile, solanum
    #            built from source, image assembly, container health
    #  33.6 min  the Playwright suite — 759 passed, one worker
    #   0.5 min  census + tear-down
    #  ------
    #  40.5 min  total
    #
    # That 4.6 min line is a BUNDLE, and #1630 is what took it apart: of
    # the equivalent 5m27s fixed cost on a post-shard run, 105.8s is mix
    # (2.6 fetch + 94.9 deps + 8.4 app) and the remaining ~3m40s is
    # submodules, solanum-from-source, the Playwright base pull, seeding
    # and container health. Only the mix half has a cache step; the split
    # and what it deliberately does not claim are on that step below.
    #
    # Only the 33.6 divides. The other 6.8 min is fixed and every shard
    # pays it in full, so four shards land at ~15 min wall clock, not the
    # ~13.4 the issue's arithmetic gave (it counted the in-script boot and
    # forgot the checkout and the tear-down). Eight would buy ~4 more
    # minutes for double the runners; 4 is the knee.
    #
    # Paying the boot ONCE was considered and rejected on the numbers: a
    # build-once job that publishes the images has to FINISH before any
    # shard starts, so it adds a serial stage the same size as the thing
    # it removes (~5 min), and 5 + pull + 8.4 is no better than four
    # parallel 15s. Layer caching (`type=gha`) might shrink the per-shard
    # build; it is NOT measured, so it is not claimed here.
    #
    # NOT measured, and it is the assumption the whole gain rests on: the
    # account's runner concurrency. If four jobs cannot start together the
    # arithmetic degrades towards the serial number.
    strategy:
      # A red shard must NOT cancel the other three. The suite's triage
      # runbook (docs/TESTING.md) works by comparing what failed against
      # what passed — cancelling the rest destroys exactly that evidence
      # and turns one red into "three unknowns". The default is true.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # 60, not 45 — third raise (25 -> 30 in 6478ef72, 30 -> 45, now 60),
    # and the reason to stop doing this arithmetic is measured in #1519:
    # across 85 green runs on main between 2026-08-11 and 2026-08-18 the
    # DAILY MEDIAN rose monotonically 36.0 -> 39.6 min, slope
    # +0.42 min/day, which put 40min runs about five minutes under the
    # 45 cap. 87% of that wall clock is one strictly serial Playwright
    # suite (34.3 of 39.6 min; `workers: 1` is load-bearing, see
    # DESIGN_NOTES) — so the growth is structural, not a regression a
    # cap can absorb.
    #
    # The principle from the 30 -> 45 raise still holds and is why the
    # new number is deliberately far above the working range: a timeout
    # is a runaway-job BACKSTOP, not a performance budget, and it should
    # only fire when something is actually wrong. #696 was killed at test
    # 589 of 590 by the cap alone, not by a failure; that must not recur.
    #
    # That raise bought headroom and fixed nothing; the SHARD below is the
    # fix, and it is one of the three levers #1519 named (the second, cache
    # the dep compile, landed in #1630; the third, make the suite
    # parallel-safe, is untouched).
    # 60 stays: a backstop belongs far above the working range, and the
    # working range just fell to ~15 min, so the cap is further from firing
    # than it has ever been. If it is ever the thing tracking the suite's
    # growth again, raise the issue, not the number.
    timeout-minutes: 60
    # `packages: read` so `docker login ghcr.io` can pull the
    # prebuilt bahamut + services images from `ghcr.io/vjt/*` (see
    # cicchetto/e2e/compose.ghcr-vjt.yaml). Default GITHUB_TOKEN has
    # this scope on the same-owner package, but only when permissions
    # are declared at the job level.
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # azzurra-testnet (cicchetto/e2e/infra) is a public submodule —
          # `recursive` initializes it via the default GITHUB_TOKEN
          # (public-repo HTTPS, no deploy key needed). Without this the
          # script bails at the submodule-empty check.
          submodules: recursive

      - name: Verify submodule populated
        run: |
          test -d cicchetto/e2e/infra/bahamut || {
            echo "azzurra-testnet submodule looks empty";
            exit 1;
          }

      - name: Upgrade docker compose plugin
        # Runner-shipped docker compose is too old to grok the
        # cicchetto/e2e/compose.yaml `include:` + per-service override
        # pattern (`services.leaf-v6 conflicts with imported resource`).
        # Newer compose merges per-service overrides into the included
        # file's service definition; older compose treats them as a
        # duplicate-resource error. Pin to v5.0.2 — matches the local
        # dev environment (CI/dev parity) so a workflow that passes
        # locally also passes on the runner.
        run: |
          COMPOSE_VER=v5.0.2
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL "https://github.com/docker/compose/releases/download/${COMPOSE_VER}/docker-compose-linux-x86_64" \
            -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version

      - name: Log in to GHCR
        # The bahamut + services images live at
        # `ghcr.io/vjt/{bahamut,services}` — published by the
        # `images.yml` workflow in the cicchetto/e2e/infra submodule
        # repo (vjt/azzurra-testnet). `secrets.GITHUB_TOKEN` is the
        # ephemeral per-run token; it has `packages: read` scope (see
        # job-level permissions above) and can pull same-owner
        # packages.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore deps/ + the dep half of _build/ (#1630)
        # The second #1519 lever. Measured off the job LOG of green run
        # 32411402873 shard 1 (shard 2 agrees to 0.2s), not off the step
        # summary — the summary bundles the whole boot into one number and
        # that is what left the split unestablished in the issue:
        #
        #     2.6s  `mix deps.get`
        #    94.9s  compiling the 76 deps, incl. the rebar3 natives (quic
        #           5.1s, webtransport, hackney) and the exqlite/argon2 NIFs
        #     8.4s  compiling grappa itself — 326 .ex, one `Compiling` line
        #   ------
        #   105.8s  of a 5m27s fixed cost, inside a 12m30s shard
        #
        # So 97.5s per shard is reachable from here and 8.4s is not. The
        # REST of the fixed cost is not reachable either, and is not claimed:
        # 29.5s recursive submodule checkout, 43.1s solanum built from
        # source, 30.6s building the Playwright runner image (736 MB base
        # pull), 32.6s ecto.create + migrate + seed, 21s container health.
        # Those are docker-layer or network — buildx `type=gha` territory, a
        # different mechanism, still unmeasured, still unclaimed.
        #
        # The seeder runs MIX_ENV=dev inside `elixir:1.19-otp-28-alpine` over
        # the `../..:/app` bind mount (cicchetto/e2e/compose.yaml), and the
        # Dockerfile bakes no deps on purpose (its line 43 says so), so deps/
        # and _build/dev/ are written to the RUNNER's workspace. That is what
        # makes them reachable by actions/cache at all. ~31 MB compressed,
        # against a 10 GB per-repo LRU budget.
        #
        # WHY THE PATH LIST EXCLUDES `_build/dev/lib/grappa` — this is the
        # contamination answer, and it is the reason this step is safe.
        # CLAUDE.md documents the failure class: a `_build` shared between
        # worktrees produced a red belonging to NO branch (#1170 — a
        # `Grappa.Version` compiled from another tree's `VERSION`). A CI
        # cache is that same shape at GitHub scale. The cure is not a
        # cleverer key, it is to put nothing branch-specific IN the cache:
        # what is stored is a pure function of files that are themselves in
        # the key. There is no branch-specific artefact to restore because
        # none was ever saved.
        #
        # And the exclusion is free. `actions/checkout` writes every source
        # with mtime=now, newer than any restored manifest, so mix recompiles
        # the app on every run whether or not its beams were restored — the
        # 8.4s above is paid either way. `VERSION` is deliberately absent
        # from the key for the same reason: it reaches only the app's beams.
        #
        # The `e2e-musl-` namespace is disjoint from ci.yml's
        # `${{ runner.os }}-mix-` and MUST stay so. These beams are built
        # under alpine/musl; ci.yml's are built by setup-beam on glibc.
        # exqlite and argon2_elixir ship NIFs, and mix rebuilds a NIF on
        # absence, not on ABI — so a crossed restore hands the alpine
        # container a glibc `.so` it considers built. `restore-keys` carries
        # the same prefix so prefix matching cannot reach across either.
        #
        # A stale key is SLOW, never WRONG: `mix deps.get` reconciles deps/
        # against mix.lock, and each dep's `.mix/compile.{lock,elixir_scm}`
        # forces a recompile when its lock entry or the Elixir version moved.
        # That is the backstop for the floating `1.19-otp-28-alpine` tag,
        # which `hashFiles('Dockerfile')` cannot see through.
        id: mix-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/dev/lib
            !_build/dev/lib/grappa
          key: ${{ runner.os }}-e2e-musl-mix-${{ hashFiles('mix.lock', 'mix.exs', 'Dockerfile', 'config/*.exs') }}
          restore-keys: |
            ${{ runner.os }}-e2e-musl-mix-

      - name: Run integration suite
        # `bash scripts/integration.sh` boots the stack, runs the
        # Playwright suite, tears the stack down on EXIT trap. Exit
        # code is the runner's exit code (test result), propagated.
        #
        # `COMPOSE_FILE` chains the base compose.yaml with our
        # CI-only override compose.ghcr-vjt.yaml that swaps the
        # bahamut + services `build:` blocks for prebuilt
        # `ghcr.io/vjt/*:main` image pulls. Saves ~37s per run (the
        # full hub + leaves + services compile cycle from source).
        # Paths are RELATIVE to the CWD that scripts/{integration,
        # testnet}.sh cd into (cicchetto/e2e/), which is where both
        # compose files live.
        #
        # The shard denominator is `strategy.job-total`, NEVER a literal 4:
        # it is the length of the matrix above, so the two cannot drift into
        # a filter that silently drops or double-runs tests. Playwright's
        # `--shard` reaches `npx playwright test` through the script's `"$@"`,
        # the same door `--grep` uses, so no script change is needed and a
        # local reproduction of shard 2 is `scripts/integration.sh --shard=2/4`.
        env:
          COMPOSE_FILE: compose.yaml:compose.ghcr-vjt.yaml
        run: bash scripts/integration.sh --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Save deps/ + the dep half of _build/ (#1630)
        # ONE writer. All four shards do byte-identical mix work under one
        # key, so letting all four save is three redundant uploads racing for
        # an entry that is immutable once written. Shard 1 writes, the rest
        # read. The paths are repeated because cache/save takes its own —
        # they MUST stay identical to the restore step's.
        #
        # `success() || failure()` and NOT `always()`: `always()` also fires
        # on CANCELLED, and this workflow sets `cancel-in-progress: true`, so
        # a superseded run would freeze a half-compiled tree under the key
        # and no later run could replace it. A FAILED run's tree is worth
        # keeping — mix's build is incremental by construction, a partial one
        # is exactly what any interrupted compile leaves and the next run
        # finishes it. That also means a red iteration under a NEW key still
        # warms the cache, which is when warmth is worth most.
        #
        # Skipped on an EXACT hit — the entry exists, saving would only log a
        # collision. A `restore-keys` partial hit is not a hit and DOES save:
        # that run is the one that just compiled the delta.
        if: matrix.shard == 1 && steps.mix-cache.outputs.cache-hit != 'true' && (success() || failure())
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/dev/lib
            !_build/dev/lib/grappa
          key: ${{ steps.mix-cache.outputs.cache-primary-key }}

      - name: Upload Playwright traces (on failure)
        # Every artifact name below carries the shard (#1519). Not cosmetic:
        # upload-artifact v4+ REFUSES a name that already exists in the run,
        # so four shards uploading `playwright-traces` would fail the upload
        # step of whichever lost the race — a red on top of the red being
        # triaged, with the evidence missing.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: cicchetto/e2e/test-results/
          # 14d is enough to triage; default 90d wastes storage on
          # a noisy suite during the early CI shakedown phase.
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright HTML report (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: cicchetto/e2e/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload testnet container logs (on failure)
        # The server half of the failure (#702) — one file per container,
        # written by scripts/integration.sh's EXIT trap before tear-down.
        # `if-no-files-found: ignore` because the job can also fail before
        # the stack exists at all (checkout, compose plugin, GHCR login).
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-logs-shard-${{ matrix.shard }}
          path: cicchetto/e2e/container-logs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload log gap census
        # #1429 — the measurement taken from the same streams, on EVERY
        # run. The artifact above stays failure-only because it is ~20 MB
        # compressed; this one is a few KB, and it is what stops the ~91%
        # of runs that pass from being unaskable about a stack stall.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: log-gap-census-shard-${{ matrix.shard }}
          path: cicchetto/e2e/container-logs/gap-scan.tsv
          retention-days: 14
          if-no-files-found: ignore

  # OIDC acceptance (#1911): a real Kanidm beside a MIX_ENV=prod grappa,
  # both host-networked in docker, and BOTH legs of the authorization-code
  # round trip driven by curl — link (self-service /me/oidc/link) and login
  # (the provider-minted session bearer answering /me/oidc) — plus the
  # #1911c gate legs (group-gated provisioning, admin flip and de-flip,
  # outsider refusal, the passwordless account refused by the password
  # door), a RAW leg where the script itself is the relying party on a
  # second client (discovery shape, hand-built PKCE S256, ES256 id_token
  # verified against the published JWKS with openssl, nonce/groups claims,
  # userinfo sub, one-shot codes, wrong-secret and unregistered-redirect
  # refusals), and the grappa-door hardening legs (bogus/replayed callback
  # state, garbage bearer, link idempotence). This is the
  # acceptance pass the #1911 commit owed: the unit suite proves grappa's
  # half over Bypass with a hand-built ES256 keypair; only a real provider
  # proves discovery parsing, PKCE S256, the id_token signature and the
  # consent page against something grappa does not control.
  #
  # Deliberately its own job and NOT a Playwright spec in the e2e shards:
  # the flow needs no browser (curl drives the UI wizard's form POSTs), a
  # Kanidm container in all four shards' stacks would be pure overhead, and
  # a failure should read as "the OIDC door broke", not as one red spec in
  # a 759-spec shard. Same reasoning as the shottino/cicchetto jobs in
  # ci.yml: separate toolchain, separate job, own verdict.
  #
  # Runs under the same path filter as the shards (the OIDC source lives
  # under lib/**, the harness under infra/oidc-e2e/** + scripts/oidc-e2e.sh,
  # all listed above). No submodules: the stack builds the repo-root
  # Dockerfile (toolchain-only) and nothing else.
  oidc-acceptance:
    name: oidc acceptance (kanidm <-> grappa, MIX_ENV=prod)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run OIDC acceptance suite
        # Everything is generated inside the script (CA, Kanidm recovery,
        # person + TOTP, OAuth2 client, grappa prod secrets) — nothing
        # secret comes from the workflow. Cold run compiles deps + app
        # into the bind-mounted tree: several minutes, once.
        run: scripts/oidc-e2e.sh

  # The one check name that cannot silently miss a shard (#1519).
  #
  # `needs.e2e.result` over a MATRIX is the aggregate of every leg: it is
  # `success` only when all four succeeded, and `failure` as soon as one
  # fails. So this job is the single place where "the suite passed" is
  # stated, and it stays true if the matrix grows to eight without anyone
  # remembering to add a name anywhere.
  #
  # `if: always()` is load-bearing and is the whole reason this is not a
  # bare `needs:`. Without it, a failed shard makes this job SKIPPED — and
  # a skipped check does not read as a failure to a human scanning the PR
  # or to a required-check rule. Skipped would be the gate that lies.
  #
  # main today has no branch protection and no ruleset (measured, 2026-08-20:
  # the protection API answers 404 and `/rulesets` is `[]`), so nothing is
  # "required" by name yet. That is exactly why the stable name is worth
  # having before it is needed: the day one is required, it is one entry,
  # not four that a fifth shard would leave behind.
  e2e-result:
    name: integration (all shards)
    if: always()
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every shard succeeded
        env:
          SHARDS_RESULT: ${{ needs.e2e.result }}
        run: |
          echo "aggregate result of the shard matrix: $SHARDS_RESULT"
          [ "$SHARDS_RESULT" = success ] || {
            echo "at least one shard did not succeed — see the per-shard jobs" >&2
            exit 1
          }
